<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="manifest" href="/manifest.json" />

  <!--
    PUSTAKA DIMUAT DARI SERVER SENDIRI, BUKAN CDN.

    Dulu React/lucide/Babel diambil dari esm.sh, unpkg.com, dan cdn.tailwindcss.com.
    Di jaringan yang memblokir CDN (umum di kantor), SEMUA gagal dimuat dan
    halaman tampil PUTIH KOSONG tanpa pesan — terbukti saat diuji dengan CDN
    diblokir. Sekarang semuanya ada di /vendor sehingga aplikasi tetap hidup.
  -->
  <script src="/vendor/react.min.js"></script>
  <script src="/vendor/react-dom.min.js"></script>

  <script type="importmap">
    {
      "imports": {
        "react": "/vendor/react-shim.js",
        "react-dom/client": "/vendor/react-shim.js",
        "lucide-react": "/vendor/lucide-shim.js",
        "react/jsx-runtime": "/vendor/react-shim.js"
      }

  </script>

  <!-- Babel dimuat di akhir body (lihat pemuat di bawah) supaya kode aplikasi
       sudah ada di DOM saat diterjemahkan. -->
</head>
<body>
  <div id="root"></div>

  <!--
    PEMUAT YANG TIDAK BERGANTUNG PADA PEMINDAIAN OTOMATIS BABEL.
    Babel versi CDN lama otomatis mencari <script type="text/babel">. Versi yang
    disimpan lokal belum tentu melakukan itu, sehingga aplikasi tidak pernah
    dijalankan (root kosong = halaman putih). Di sini kode ditransformasi lalu
    dijalankan secara eksplisit sebagai modul, dengan pesan galat yang terlihat.
  -->
  <script type="text/babel" data-type="module" id="kodeAplikasi">
    import React, { useState, useEffect, useMemo, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      MapPin, Phone, MessageSquare, CheckCircle, AlertCircle, 
      LayoutDashboard, Users, Loader2, RefreshCw, Database, Info, 
      Lock, UserCircle, LogOut, ChevronDown, Camera, X, Save, Edit,
      FileText, ImageIcon, ExternalLink, Sun, Moon
    } from 'lucide-react';
    // Firebase SUDAH TIDAK DIPAKAI. Sebelumnya dipakai untuk posisi GPS
    // (collection locations & routes, login anonim) — semuanya kini ditangani
    // oleh Cloudflare Workers + D1, jadi tidak ada penulisan ke Firestore lagi
    // dan tidak ada kredensial Firebase di kode aplikasi.

    const IDB_NAME = 'ColeqOfflineDB';
    const IDB_VERSION = 1;
    const IDB_STORE = 'offline_visits';

    const openIDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(IDB_NAME, IDB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE, { keyPath: 'id', autoIncrement: true });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const getIDBQueue = async () => {
      try {
        const db = await openIDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const store = tx.objectStore(IDB_STORE);
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      } catch (err) { return []; }
    };

    const addIDBItem = async (item) => {
      const db = await openIDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        const store = tx.objectStore(IDB_STORE);
        const req = store.add(item);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };

    const updateIDBItem = async (item) => {
      const db = await openIDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        const store = tx.objectStore(IDB_STORE);
        const req = store.put(item);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };

    const deleteIDBItem = async (id) => {
      const db = await openIDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        const store = tx.objectStore(IDB_STORE);
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    };

    // API mobile mengirim kolom HURUF BESAR (SO_POKOK_TDY, KOL_TDY, ...),
    // sedangkan kode lama membaca huruf kecil. Akibatnya saldo pokok tampil 0
    // dan KOL tampil "-" walau datanya ada. Helper ini membaca keduanya.
    const ambilKolom = (r, ...nama) => {
      if (!r) return undefined;
      for (const n of nama) {
        if (r[n] !== undefined && r[n] !== null && r[n] !== '') return r[n];
        const besar = String(n).toUpperCase();
        if (r[besar] !== undefined && r[besar] !== null && r[besar] !== '') return r[besar];
      }
      return undefined;
    };

    const getAcct = (r) => {
      if (!r) return null;
      let val = ambilKolom(r, 'acctno') || r.no_rekening || r.account_no || r.rekening || r['no rekening'] || r['no. rekening'] || r['acct no'] || r['nomor rekening'] || r.norek || r.account || r.fasilitas || r['no fasilitas'] || r.no_fasilitas || r['no. rek'] || r['no rek'] || r.loan || r['no loan'];
      return val ? String(val).trim() : null;
    };
    const getUserId = (r) => {
      if (!r) return "";
      let val = r.id_user || r.petugas || r.id || r['id petugas'] || r.userid || r['user id'] || r.username;
      return val ? String(val).trim() : "";
    };
    const getUserName = (r) => {
      if (!r) return "";
      let val = ambilKolom(r, 'nama_user', 'sname', 'nama_debitur') || r.nama || r.name || r.nama_petugas || r['nama petugas'] || r['nama lengkap'] || r['nama debitur'];
      return val ? String(val).trim() : "";
    };
    const getUserLevel = (r) => {
      if (!r) return 3;
      let val = r.level_user || r.level || r.role || r.hak_akses || r['hak akses'];
      return (val !== undefined && val !== "") ? Number(val) : 3;
    };
    
    const stripDecimals = (str) => {
        let val = String(str).trim();
        if (val.endsWith('.00')) val = val.slice(0, -3);
        if (val.endsWith(',00')) val = val.slice(0, -3);
        if (val.startsWith('(') && val.endsWith(')')) val = '-' + val.slice(1, -1);
        return val;
    };

    const parseNominal = (val) => {
        let str = stripDecimals(val || '0');
        const isNeg = str.includes('-');
        const num = parseInt(str.replace(/[^0-9]/g, ''), 10) || 0;
        return isNeg ? -num : num;
    };

    const formatUang = (val) => {
        if (val === null || val === undefined || val === '-' || val === '') return '-';
        let str = stripDecimals(val);
        const isNeg = str.includes('-');
        const num = parseInt(str.replace(/[^0-9]/g, ''), 10) || 0;
        if (num === 0 && !str.includes('0')) return '-'; 
        return isNeg ? `-${num.toLocaleString('id-ID')}` : num.toLocaleString('id-ID');
    };

    const formatWhatsAppNumber = (phone) => {
      if (!phone) return null;
      let cleaned = phone.toString().replace(/\D/g, '');
      if (cleaned.startsWith('0')) cleaned = '62' + cleaned.substring(1);
      else if (!cleaned.startsWith('62')) cleaned = '62' + cleaned;
      return cleaned;
    };
    const getCurrentDateTime = () => {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    };

    const getLocalDateStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const getDisplayImageUrl = (url) => {
      if (!url) return '';
      if (url.startsWith('data:image')) return url;
      if (url.includes('drive.google.com')) {
        const idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
        if (idMatch && idMatch[1]) {
          return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w1200`;
        }
      }
      return url;
    };

    // ============================================================================
    // --- KOMUNIKASI KE SERVER (Cloudflare Workers + D1) ---
    // Menggantikan Apps Script (VISIT_WEBAPP_URL) + Firebase Firestore.
    //
    // Perubahan penting dibanding versi lama:
    //   - Login menukar ID+password dengan TOKEN PERANGKAT (disimpan di HP).
    //     Password tidak lagi disimpan di HP dan token statis tidak dipakai.
    //   - Setiap request membawa header Authorization: Bearer <token>.
    //   - Posisi GPS tidak lagi ditulis ke Firestore (kuota gratisnya cepat
    //     habis: 18 petugas x 1 menit x 8 jam = ~8.600 tulis/hari).
    //     Sekarang dikirim ke server; server menyimpan posisi terakhir di KV
    //     (ringan) dan hanya menyaring titik jejak ke D1.
    // ============================================================================
    // Saat diuji lokal, backend lokal dipakai kalau memang ada di port 8803.
    // Selain itu (termasuk halaman disajikan dari localhost tanpa backend lokal)
    // tetap mengarah ke server produksi.
    const API_DASAR = (window.CLQ_API_UJI === true)
      ? "http://127.0.0.1:8803"
      : "https://clqportal.244.my.id";   // workers.dev diblokir di sebagian jaringan operator HP

    const ambilToken = () => {
      try { return localStorage.getItem('clq_token') || ''; } catch (e) { return ''; }
    };
    const simpanToken = (t) => {
      try { t ? localStorage.setItem('clq_token', t) : localStorage.removeItem('clq_token'); } catch (e) {}
    };

    /** Panggil API baru. Mengembalikan objek { status, ... } seperti versi lama. */
    const panggilApi = async (jalur, opsi = {}) => {
      const token = ambilToken();
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;

      // BATAS WAKTU WAJIB (19 Okt): tanpa ini, satu permintaan yang menggantung
      // membuat tombol "Menyimpan..." berputar SELAMANYA dan data petugas tidak
      // pernah terkirim. Terbukti di uji: server membalas 69 ms, tetapi tombol
      // tetap "Menyimpan..." lebih dari 30 detik karena await tidak pernah selesai.
      // Foto bisa besar, jadi batasnya longgar (150 dtk) tetapi pasti berakhir.
      const pengawas = new AbortController();
      const batas = setTimeout(() => pengawas.abort(), opsi.batasMs || 150000);
      let response;
      try {
        response = await fetch(API_DASAR + jalur, {
          method: opsi.method || 'GET',
          headers,
          body: opsi.body ? JSON.stringify(opsi.body) : undefined,
          signal: pengawas.signal,
        });
      } catch (e) {
        clearTimeout(batas);
        if (e && e.name === 'AbortError') {
          throw new Error('Server tidak merespons dalam 150 detik. Periksa sinyal, lalu coba simpan lagi.');
        }
        throw e;
      } finally {
        clearTimeout(batas);
      }

      let data = null;
      try { data = await response.json(); } catch (e) { data = null; }

      // token ditolak -> bersihkan supaya petugas diminta login ulang
      if (response.status === 401) {
        simpanToken('');
        try { localStorage.removeItem('clq_app_user'); } catch (e) {}
        throw new Error((data && data.message) || 'Sesi berakhir. Silakan login ulang.');
      }

      // Kegagalan server (503 kuota habis, 500, dll) harus menjadi ERROR dengan
      // pesan aslinya — bukan dikembalikan sebagai objek biasa yang membuat
      // login tampil "gagal" tanpa alasan yang jelas.
      if (response.status >= 500) {
        throw new Error((data && data.message) || ('Server bermasalah (HTTP ' + response.status + ')'));
      }

      if (!data) throw new Error('Respon server tidak valid (HTTP ' + response.status + ')');
      return data;
    };

    /**
     * Lapisan kompatibilitas: nama aksi lama -> endpoint baru.
     * Dipertahankan supaya bagian lain aplikasi tidak perlu diubah semua.
     */
    /**
     * Nama perangkat yang manusiawi untuk dicatat server.
     * User agent penuh tidak berguna di peringatan ("Mozilla/5.0 (Linux; Android 16..."),
     * jadi diambil model HP saja: "Android 14 · POCO X6 Pro".
     */
    const namaPerangkatRingkas = () => {
      try {
        const ua = navigator.userAgent || '';
        const android = ua.match(/Android\s+([\d.]+)/i);
        const model = ua.match(/;\s*([^;)]+?)\s*(?:Build|\/)/i);
        const androidNama = android ? 'Android ' + android[1] : (window.CLQ_APP ? 'Aplikasi CLQ' : 'Browser');
        const namaModel = model && model[1] && !/^wv$/i.test(model[1].trim()) ? model[1].trim() : '';
        return (androidNama + (namaModel ? ' \u00b7 ' + namaModel : '')).slice(0, 60);
      } catch (e) { return 'Perangkat HP'; }
    };

    const callApi = async (action, payload = {}) => {
      try {
        switch (action) {
          case 'login': {
            const r = await panggilApi('/api/mobile/login', {
              method: 'POST',
              body: {
                id_user: payload.id_user,
                password: payload.password,
                nama_perangkat: namaPerangkatRingkas(),
              },
            });
            if (r.status === 'success' && r.token) {
              simpanToken(r.token);
              // Teruskan penanda wajib ganti password; tanpa ini aplikasi
              // langsung masuk padahal server menandai token sebagai terbatas.
              return {
                status: 'success',
                user: r.user,
                wajib_ganti_password: r.wajib_ganti_password === true,
                // Server melaporkan HP yang dipakai sebelumnya. Akun yang sama
                // hanya bisa aktif di satu HP pada satu waktu, jadi petugas
                // diberi tahu — supaya tidak bingung kenapa HP lama berhenti.
                login_hp_baru: r.login_hp_baru || null,
              };
            }
            // Akun yang password-nya wajib diganti ditolak server (409 GANTI_PASSWORD).
            // Beri pesan tegas supaya petugas tahu harus lewat browser dulu,
            // bukan mengira aplikasi rusak.
            if (r && r.kode === 'GANTI_PASSWORD') {
              return {
                status: 'error',
                message: 'Password Anda harus diganti dulu. Buka portal di browser HP/laptop, '
                       + 'masuk, lalu ganti password. Setelah itu baru bisa login di aplikasi ini.',
              };
            }
            return r;
          }

          case 'get_dashboard_init': {
            const [ringkas, params] = await Promise.all([
              panggilApi('/api/mobile/ringkasan'),
              panggilApi('/api/mobile/parameter'),
            ]);
            if (ringkas.status !== 'success') return ringkas;
            return {
              status: 'success',
              dashboardStats: ringkas.ringkasan,
              parameters: params.parameters,
              clusterName: 'CLQ MAMUJU',
            };
          }

          case 'get_visit_pending':
            return panggilApi('/api/mobile/tugas');

          case 'get_rindeb':
            // hanya_tugas=1: server hanya mengirim acctno yang memang ada di daftar
            // tugas petugas ini, bukan 500 acctno kelolaan. Penghematan terukur:
            // 18.409 -> 3.136 langkah baca D1 (-83%), dan petugas dengan kelolaan
            // >500 tidak lagi kehilangan nama/alamat untuk tugas di luar 500 pertama.
            return panggilApi('/api/mobile/debitur?limit=500&hanya_tugas=1');

          case 'get_bayar': {
            // Debitur yang sudah bayar HARI INI, hanya dari kelolaan petugas ini.
            const r = await panggilApi('/api/mobile/bayar');
            return r;
          }

          case 'get_report': {
            const q = [];
            if (payload.date_from) q.push('dari=' + encodeURIComponent(payload.date_from));
            if (payload.date_to)   q.push('sampai=' + encodeURIComponent(payload.date_to));
            return panggilApi('/api/mobile/laporan' + (q.length ? '?' + q.join('&') : ''));
          }

          case 'update_visit': {
            const d = payload.data || {};
            return panggilApi('/api/mobile/visit', {
              method: 'POST',
              body: {
                visit_id: payload.visit_id || '',
                acctno: d.ACCTNO || d.acctno,
                tanggal: d['TANGGAL VISIT'] || d.TANGGAL || d.tanggal,
                kondisi_rumah: d['KONDISI RUMAH'],
                bertemu_dengan: d['BERTEMU DENGAN'],
                rukos: d['RUKOS'],
                catatan: d['CATATAN'],
                tgl_janji_bayar: d['TGL JANJI BAYAR'],
                tindakan: d['TINDAKAN'],
                kontak_hp_baru: d['KONTAK HP BARU'],
                foto_rumah: d['FOTO RUMAH'],
                foto_tindakan: d['FOTO TINDAKAN'],
                lat: d['LAT'],
                lon: d['LON'],
                akurasi: d['AKURASI'],
              },
            });
          }

          // posisi tidak lagi lewat callApi (pakai kirimPosisi), tapi
          // disediakan kalau ada bagian lama yang masih memanggil edit_user
          case 'edit_user':
            return { status: 'success' };

          default:
            return { status: 'error', message: 'Aksi tidak dikenal: ' + action };
        }
      } catch (error) {
        return { status: 'error', message: error.message || 'Koneksi ke server gagal' };
      }
    };

    /** Kirim satu titik posisi GPS ke server. */
    const kirimPosisi = async (koordinat) => {
      if (!ambilToken() || !koordinat) return { status: 'error', message: 'Belum login' };
      return panggilApi('/api/mobile/posisi', {
        method: 'POST',
        body: {
          lat: koordinat.lat,
          lon: koordinat.lng,
          akurasi: koordinat.akurasi ?? null,
          baterai: koordinat.baterai ?? null,
          sumber: koordinat.sumber || 'watch',
          waktu: null,   // server yang mencatat waktu
        },
      });
    };

    /**
     * Lapisan Android (APK) mendaftarkan jembatan ini untuk menerima token,
     * supaya Service pelacakan latar belakang bisa mengirim posisi. Di browser
     * biasa jembatan ini tidak ada, jadi semua baris di bawah dibungkus try.
     */
    const kirimKredensialKeAndroid = () => {
      try {
        if (!window.CLQAndroid || !window.CLQAndroid.setKredensial) return;
        const t = ambilToken();
        if (!t) return;
        const dasar = window.CLQ_API_UJI === true ? 'http://127.0.0.1:8803/api/mobile' : 'https://clqportal.244.my.id/api/mobile';
        window.CLQAndroid.setKredensial(dasar + '/posisi', t);
      } catch (e) {}
    };

    /**
     * Panel diagnosa pelacakan sudah DISEMBUNYIKAN (permintaan pemilik).
     * Komponennya sengaja dihapus dari tampilan supaya petugas tidak melihatnya.
     * Jembatan Android (window.CLQAndroid) tetap ada; kalau suatu saat perlu
     * diagnosa lagi, cukup kembalikan <PanelPelacakan /> dari riwayat git.
     */
    const PanelPelacakan = () => null;

    /** Upload foto (base64) ke server, dapat kunci penyimpanan. */
    const kirimFoto = async (base64, jenis) => {
      if (!ambilToken() || !base64) return null;
      const r = await panggilApi('/api/mobile/foto', {
        method: 'POST',
        body: { data: base64, jenis },
      });
      return (r && r.status === 'success') ? r.kunci : null;
    };

    /** Ambil persen baterai (kalau API tersedia di HP). */
    const ambilBaterai = async () => {
      try {
        if (navigator.getBattery) {
          const b = await navigator.getBattery();
          return Math.round(b.level * 100);
        }
      } catch (e) {}
      return null;
    };

    function MobileApp() {
      // Non-blocking initial user state for 0ms instant render
      const [appUser, setAppUser] = useState(() => {
        try {
          const saved = localStorage.getItem('clq_app_user');
          return saved ? JSON.parse(saved) : null;
        } catch(e) { return null; }
      }); 

      const [user, setUser] = useState({ uid: appUser ? 'session-active' : 'mode-sandbox' });
      const [loading, setLoading] = useState(false); // Non-blocking loading screen

      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [showInstallBanner, setShowInstallBanner] = useState(false);
      
      const [loginId, setLoginId] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);
      const [loginError, setLoginError] = useState('');
      // Layar ganti password: muncul setelah login bila server menandai akun ini
      // wajib ganti password (wajib_ganti_password=true).
      const [perluGantiPassword, setPerluGantiPassword] = useState(false);
      const [pwLama, setPwLama] = useState('');
      const [pwBaru, setPwBaru] = useState('');
      const [pwUlang, setPwUlang] = useState('');
      const [pwError, setPwError] = useState('');
      const [pwSukses, setPwSukses] = useState('');
      const [sedangGanti, setSedangGanti] = useState(false);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [modalConfig, setModalConfig] = useState({ isOpen: false, type: 'info', title: '', message: '', onConfirm: null });

      const [showUserForm, setShowUserForm] = useState(false);
      const [userFormData, setUserFormData] = useState({ id_user: '', nama_user: '', password: '', level_user: '3', jabatan: '', lat: '', lon: '', last_update: '', foto_user: '' });
      const [isSavingUser, setIsSavingUser] = useState(false);

      const [visitData, setVisitData] = useState([]);
      const [isFetchingVisit, setIsFetchingVisit] = useState(false);
      // Kamera in-app: { buka, field, siap, pesan, kamera }

      const bukaKamera = (field) => {

      const gambarKeKanvas = async (sumber, width, height, field) => {
            const MAX_DIMENSION = 1080; let scale = 1;
            if (width > height && width > MAX_DIMENSION) scale = MAX_DIMENSION / width;
            else if (height >= width && height > MAX_DIMENSION) scale = MAX_DIMENSION / height;

            const canvas = document.createElement('canvas'); canvas.width = width * scale; canvas.height = height * scale;
            const ctx = canvas.getContext('2d'); ctx.drawImage(sumber, 0, 0, canvas.width, canvas.height);
            
            const watermarkHeight = canvas.height * 0.30; const blockHeight = watermarkHeight / 3; const startY = canvas.height - watermarkHeight; const padX = canvas.width * 0.04; 
            const fontFamily = 'Cairo, sans-serif'; ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 6; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2; 

            const fillTextFit = (text, x, y, maxWidth, initialFontSize, weight) => {
              let fontSize = initialFontSize; ctx.font = `${weight} ${fontSize}px ${fontFamily}`;
              while (ctx.measureText(text).width > maxWidth && fontSize > 8) { fontSize -= 0.5; ctx.font = `${weight} ${fontSize}px ${fontFamily}`; }
              ctx.fillText(text, x, y);
            };

            const logoUrl = "https://lh3.googleusercontent.com/d/1qDaQ3F_0RDvC8GY8JQ1AKMEFYiiB-sgy"; 
            const logoImg = new Image(); logoImg.crossOrigin = "Anonymous"; 
            await new Promise((resolve) => { logoImg.onload = resolve; logoImg.onerror = resolve; logoImg.src = logoUrl; });

            if (logoImg.complete && logoImg.naturalWidth !== 0) {
                const logoH = blockHeight * 0.7; const logoW = (logoImg.naturalWidth / logoImg.naturalHeight) * logoH; const logoY = startY + (blockHeight * 0.15); 
                ctx.drawImage(logoImg, padX, logoY, logoW, logoH);
            } else {
                ctx.font = `900 ${blockHeight * 0.5}px ${fontFamily}`; ctx.fillStyle = '#ffffff'; ctx.textBaseline = 'middle'; ctx.fillText('BANK BTN', padX, startY + (blockHeight / 2));
            }

            const block2Y = startY + blockHeight; const now = new Date();
            const jamStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const tglStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu']; const hariStr = days[now.getDay()];

            ctx.font = `700 ${blockHeight * 0.7}px ${fontFamily}`; ctx.fillStyle = '#ffffff'; ctx.textBaseline = 'middle'; ctx.fillText(jamStr, padX, block2Y + (blockHeight / 2));
            const lineX = padX + ctx.measureText(jamStr).width + (canvas.width * 0.03); 
            ctx.shadowColor = 'transparent'; ctx.beginPath(); ctx.moveTo(lineX, block2Y + (blockHeight * 0.2)); ctx.lineTo(lineX, block2Y + (blockHeight * 0.8)); ctx.lineWidth = Math.max(3, canvas.width * 0.006); ctx.strokeStyle = '#ef4444'; ctx.stroke();
            ctx.shadowColor = 'rgba(0,0,0,0.9)'; 

            const textX = lineX + (canvas.width * 0.03);
            ctx.font = `500 ${blockHeight * 0.3}px ${fontFamily}`; ctx.textBaseline = 'bottom'; ctx.fillText(tglStr, textX, block2Y + (blockHeight * 0.45)); 
            ctx.textBaseline = 'top'; ctx.fillText(hariStr, textX, block2Y + (blockHeight * 0.55)); 

            const block3Y = startY + (2 * blockHeight);
            let baris1 = "Lokasi tidak diketahui"; let baris2 = "Menunggu alamat..."; let baris3 = locationData.lat !== null && locationData.lat !== '-' ? `Lat: ${locationData.lat}, Lng: ${locationData.lng}` : "Sinyal GPS belum didapatkan...";

            if (locationData.address && !locationData.address.includes('Mencari') && !locationData.address.includes('Gagal')) {
                const parts = locationData.address.split(',').map(s => s.trim()).filter(Boolean);
                if (parts.length > 0) {
                    if (parts.length >= 4) { baris1 = `${parts[0]}, ${parts[1]}`; baris2 = parts.slice(2, -1).join(', '); } 
                    else if (parts.length > 1) { baris1 = parts[0]; baris2 = parts.slice(1, -1).length > 0 ? parts.slice(1, -1).join(', ') : parts[1]; } 
                    else { baris1 = parts[0]; baris2 = ""; }
                }
            } else if (locationData.lat !== null && locationData.lat !== '-') {
                 baris1 = "Jaringan lambat / Area tak terpetakan"; baris2 = "Periksa koneksi internet Anda.";
            }

            const maxTextW = canvas.width - (padX * 2);
            ctx.fillStyle = '#ffffff'; ctx.textBaseline = 'bottom'; fillTextFit(baris1, padX, block3Y + (blockHeight * 0.35), maxTextW, blockHeight * 0.28, '700');
            ctx.fillStyle = '#f8fafc'; ctx.textBaseline = 'top'; fillTextFit(baris2, padX, block3Y + (blockHeight * 0.40), maxTextW, blockHeight * 0.22, '400');
            ctx.fillStyle = '#fbbf24'; ctx.textBaseline = 'top'; fillTextFit(baris3, padX, block3Y + (blockHeight * 0.70), maxTextW, blockHeight * 0.20, '500');
            ctx.textBaseline = 'alphabetic';

            return canvas.toDataURL('image/jpeg', 0.8);


      };

      const tangkapKamera = async () => {

      const fetchVisitData = async () => {

                // Nilai diambil dari Rindeb bila ada, kalau tidak dari baris tugas.
                // API mengirim kolom HURUF BESAR, jadi pakai ambilKolom — dulu
                // `matchRindeb.so_pokok_tdy` selalu undefined sehingga SISA POKOK

          const res = await callApi('get_dashboard_init', { id_user: myId });

          if (res && res.status === 'success') {
             // Server mengirim `dashboardStats` (bukan `stats`). Dulu kuncinya

             if (res.dashboardStats) setDashboardStats(res.dashboardStats);
             // Server tidak mengirim todayReport (kode ini memang sudah mati).
             // Laporan diambil lewat handleFetchReport pada useEffect di bawah.
             // Server TIDAK mengirim bayarList (kunci ini memang tidak pernah ada).
             // Daftar bayar diambil lewat aksi get_bayar: hanya debitur di
             // kelolaan petugas ini yang membayar HARI INI.
             if (res.clusterName) {
                setClusterName(res.clusterName);
                localStorage.setItem('clq_cluster_name', res.clusterName);
             }
             if (res.parameters) {
                setParameters(res.parameters);
                localStorage.setItem('clq_params_cache', JSON.stringify(res.parameters));
             }

             // Save bundle to localStorage for instant 0ms render next time
             try {
                localStorage.setItem('clq_dash_bundle_' + myId, JSON.stringify(res));
             } catch(e) {}
          }
        } catch (err) { 
           console.error("Gagal menarik data dashboard init bundle", err); 
        } finally { 
           setIsFetchingStats(false); 
           setIsFetchingReport(false);
        }
      };

      // Debitur yang sudah bayar HARI INI (hanya kelolaan petugas ini).
      const handleFetchBayar = async () => {
        if (!appUser) return;
        try {
          const res = await callApi('get_bayar');
          if (res && res.status === 'success') {
            setBayarData((res.data || []).map(b => ({
              acctno: b.acctno,
              sname: b.sname || 'Tanpa Nama',
              lpdloc: b.lpdloc || 'TIDAK DIKETAHUI',
              kol_tdy: b.kol_tdy_kode != null ? String(b.kol_tdy_kode) : '-',
              so_pokok_tdy: b.so_pokok_tdy || 0,
              tgk_angsuran: b.tgk_angsuran || 0,
              tglupdate: b.tglupdate,
            })));
          }
        } catch (e) {
          // jangan ganggu tampilan utama kalau bagian ini gagal
        }
      };

      const handleFetchReport = async (dariArg, sampaiArg) => {
        // Menerima rentang eksplisit: tombol pintas (7 HARI/30 HARI/BULAN INI)
        // sebelumnya memakai setTimeout untuk menunggu state berubah, tetapi
        // fungsi closure memakai nilai LAMA sehingga hasilnya tidak berubah.
        // Sekarang nilai dikirim langsung — tidak bergantung pada timing state.
        const dari = dariArg || reportFilterDateStart;
        const sampai = sampaiArg || reportFilterDateEnd;
        // Dulu ada jalan pintas: kalau rentang = hari ini, ia memanggil
        // fetchDashboardData() dan berharap server mengirim `todayReport`.
        // Server TIDAK PERNAH mengirim kunci itu, sehingga daftar jadi kosong.
        // Sekarang SELALU ambil dari /api/mobile/laporan (satu permintaan).
        if (!appUser) return;
        if (!dari || !sampai) {
          showNotification('warning', 'Tanggal Belum Lengkap', 'Isi tanggal awal dan tanggal akhir laporan.');
          return;
        }
        if (dari > sampai) {
          showNotification('warning', 'Tanggal Terbalik', 'Tanggal awal tidak boleh melewati tanggal akhir.');
          return;
        }

        setIsFetchingReport(true);
        try {
          const myId = getUserId(appUser).toUpperCase();
          const res = await callApi('get_report', { date_from: dari, date_to: sampai, id_user: myId });
          
          if(res && res.status === 'success') {
             const rawReports = res.data || [];
             const getRawDate = (r) => r.tanggal || r['tanggal visit'] || r.tanggal_visit || r['tgl visit'] || '';
             rawReports.sort((a,b) => new Date(getRawDate(b) || 0) - new Date(getRawDate(a) || 0));
             
             // Foto disimpan sebagai KUNCI (foto/ID/tahun-bulan/xxx.jpg), bukan
             // URL. Sebelumnya kunci ini tidak pernah diubah menjadi alamat, dan
             // server hanya mengirim penanda 1/0, sehingga kartu selalu
             // menampilkan "Tanpa Foto" walau fotonya ADA di R2.
             // Di sini kunci diubah menjadi URL lengkap + token perangkat.
             const tokenFoto = ambilToken();
             const keUrlFoto = (k) => {
                if (!k) return '';
                if (/^https?:|^data:/.test(k)) return k;
                const dasar = API_DASAR + '/api/foto/' + k.split('/').map(encodeURIComponent).join('/');
                return tokenFoto ? dasar + '?token=' + encodeURIComponent(tokenFoto) : dasar;
             };

             setReportData(rawReports.map(visit => ({
                ...visit,
                acctno: getAcct(visit),
                foto_rumah: keUrlFoto(visit.foto_rumah || visit['foto rumah']),
                foto_tindakan: keUrlFoto(visit.foto_tindakan || visit['foto tindakan']),
                kondisi_rumah: visit.kondisi_rumah || visit['kondisi rumah'] || '-',
                sname: getUserName(visit) || "Tanpa Nama",
                lpdloc: visit.lokasi || visit.lpdloc || "TIDAK DIKETAHUI",
                alamat_agunan: visit.alamat_agunan || visit.alamat || "-",
                so_pokok_tdy: visit._rindeb_so_pokok || ambilKolom(visit, 'so_pokok_tdy') || "0",
                kol_tdy: visit._rindeb_kol || ambilKolom(visit, 'kol_tdy', 'kol_tdy_nama', 'kol_tdy_kode') || "-",
                tgk_angsuran: visit.tgk_angsuran || "0",
                tanggal: String(getRawDate(visit)).trim()
             })));
          } else {
             throw new Error(res?.message || 'Format JSON dari server rusak atau time-out.');
          }
        } catch(e) {
          showNotification('error', 'Gagal Memuat Laporan', e.message || 'Koneksi ke Apps Script terputus.');
        } finally {
          setIsFetchingReport(false);
        }
      };

      // NAMA AKSI SIMPAN KUNJUNGAN.
      // Dulu kode ini memakai VISIT_ACTION_NAME yang TIDAK PERNAH DIDEKLARASIKAN,
      // sehingga setiap kali petugas menekan "Simpan Visit" muncul
      // "VISIT_ACTION_NAME is not defined" dan kunjungan TIDAK PERNAH tersimpan.
      // Ini penyebab laporan lapangan selalu gagal masuk.
      // callApi('update_visit') memanggil POST /api/mobile/visit.
      const VISIT_ACTION_NAME = 'update_visit';

      const submitVisitForm = async () => {
        const requiredFields = [
          { key: "KONDISI RUMAH", label: "Kondisi Rumah" }, 
          { key: "BERTEMU DENGAN", label: "Bertemu Dengan" }, 
          { key: "RUKOS", label: "Rukos" }, 
          { key: "TINDAKAN", label: "Tindakan" }, 
          { key: "CATATAN", label: "Catatan" }, 
          { key: "FOTO RUMAH", label: "Foto Rumah" }
        ];

        for (let field of requiredFields) {
          if (!visitFormData[field.key] || visitFormData[field.key].trim() === "") { 
            showNotification('warning', 'Data Belum Lengkap', `Mohon lengkapi kolom "${field.label}" terlebih dahulu.`); 
            return; 
          }
        }

        setIsSavingVisitForm(true);
        try {
        // Foto dikirim ke R2 dulu (kalau ada), karena yang disimpan di database
        // hanyalah KUNCI-nya. Kalau upload gagal, kunjungan tetap disimpan
        // supaya data kunjungan tidak hilang hanya karena masalah foto.
        //
        // PENTING: seluruh proses dibungkus try/finally di SINI (bukan hanya di
        // bawah). Sebelumnya, bila unggah foto melempar galat, kode melompat ke
        // luar dan setIsSavingVisitForm(false) TIDAK PERNAH dijalankan — tombol
        // "Menyimpan..." berputar selamanya. Itu kondisi yang dilaporkan petugas.
        let kunciRumah = visitFormData["FOTO RUMAH"] || "";
        let kunciTindakan = visitFormData["FOTO TINDAKAN"] || "";
        try {
          if (kunciRumah && kunciRumah.startsWith('data:')) {
            const k = await kirimFoto(kunciRumah, 'rumah');
            kunciRumah = k || "";
          }
        } catch (eFoto) {
          // Foto gagal diunggah: jangan gagalkan kunjungan, tapi beri tahu.
          showNotification('warning', 'Foto Gagal Diunggah',
            'Kunjungan tetap disimpan tanpa foto. ' + (eFoto && eFoto.message ? eFoto.message : ''));
          kunciRumah = "";
        }
        try {
          if (kunciTindakan && kunciTindakan.startsWith('data:')) {
            const k = await kirimFoto(kunciTindakan, 'tindakan');
            kunciTindakan = k || "";
          }
        } catch (eFoto2) {
          kunciTindakan = "";
        }

        const finalVisitData = {
            ...visitFormData,
            "TANGGAL VISIT": visitFormData["TANGGAL"], 
            "TGL VISIT": visitFormData["TANGGAL"],
            "TANGGAL_VISIT": visitFormData["TANGGAL"],
            "FOTO RUMAH": kunciRumah,
            "FOTO TINDAKAN": kunciTindakan,
            "LAT": (locationData && locationData.lat !== '-' && locationData.lat !== null) ? String(locationData.lat) : "",
            "LON": (locationData && locationData.lng !== '-' && locationData.lng !== null) ? String(locationData.lng) : "",
            "AKURASI": (locationData && locationData.akurasi) ? locationData.akurasi : null
        };

        const payload = { action: VISIT_ACTION_NAME, visit_id: activeVisitCustomer['visit id'] || activeVisitCustomer.visit_id || '', data: finalVisitData };

        // Jejak rute TIDAK ditulis dari sini. Server mencatat titik kunjungan
        // (sumber: 'kunjungan') saat kunjungan disimpan, jadi tidak ada
        // penulisan ganda. Firebase sudah tidak dipakai sama sekali.

        const saveToOfflineQueue = async () => {
          try {
            const currentQueue = await getIDBQueue();
            const existing = currentQueue.find(item => item.acctNo === visitFormData.ACCTNO);
            if (existing && existing.id !== undefined) {
              await deleteIDBItem(existing.id);
            }

            const idbItem = {
              acctNo: visitFormData.ACCTNO,
              payload: payload,
              createdAt: Date.now(),
              retryCount: 0
            };
            await addIDBItem(idbItem);
            const updatedQueue = await getIDBQueue();
            setOfflineQueue(updatedQueue);
            showNotification('info', 'Tersimpan Secara Offline', 'Koneksi terputus. Data disimpan aman di HP dan otomatis dikirim saat sinyal kembali.');
            setActiveTab('visit'); 
            setActiveVisitCustomer(null);
          } catch(e) {
            showNotification('error', 'Gagal Simpan Offline', e.message);
          }
        };

        if (isOffline) { await saveToOfflineQueue(); return; }

        try {
          const res = await callApi(VISIT_ACTION_NAME, { visit_id: payload.visit_id, data: payload.data });

          if (res && res.status === 'success') {
            showNotification('success', 'Visit Tersimpan', 'Data hasil kunjungan berhasil diunggah.');
            await fetchVisitData(); setActiveTab('visit'); setActiveVisitCustomer(null);
          } else throw new Error(res?.message || 'Format respon server tidak valid.');
        } catch (error) {
          const pesan = (error && error.message) || '';
          if (pesan.includes("Failed to fetch") || pesan.includes("NetworkError") || pesan.includes("Unexpected token") || pesan.includes("tidak merespons")) {
            await saveToOfflineQueue();
          } else {
            showNotification('error', 'Penyimpanan Gagal', pesan || 'Terdapat kesalahan pada jaringan.');
          }
        }
        } catch (luar) {
          // Jaring terakhir: apa pun yang gagal di luar perkiraan tetap memberi
          // pesan dan mengaktifkan tombol kembali.
          showNotification('error', 'Penyimpanan Gagal', (luar && luar.message) || 'Kesalahan tidak terduga.');
        } finally {
          // WAJIB dijalankan pada SEMUA jalur (termasuk return di blok offline).
          setIsSavingVisitForm(false);
        }
      };

      const syncOfflineQueue = async () => {
        if (isSyncing || !navigator.onLine) return;
        const queue = await getIDBQueue();
        if (!queue || queue.length === 0) return;

        setIsSyncing(true); let successCount = 0;

        for (let i = 0; i < queue.length; i++) {
          const item = queue[i];
          try {
            const res = await callApi(item.payload.action, { visit_id: item.payload.visit_id, data: item.payload.data });

            if (res && res.status === 'success') { 
              successCount++; 
              if (item.id !== undefined) await deleteIDBItem(item.id);
            } else {
              const retries = (item.retryCount || 0) + 1;
              if (retries >= 3) {
                if (item.id !== undefined) await deleteIDBItem(item.id);
              } else {
                item.retryCount = retries;
                await updateIDBItem(item);
              }
            }
          } catch (err) { 
            break; 
          }
        }

        const remainingQueue = await getIDBQueue();
        setOfflineQueue(remainingQueue); setIsSyncing(false);

        if (successCount > 0) {
          showNotification('success', 'Sinkronisasi Selesai', `${successCount} data offline berhasil dikirim!`);
          if (activeTab === 'visit' || activeTab === 'dashboard') fetchVisitData(); 
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!loginId.trim() || !loginPassword.trim()) return;
        setIsLoggingIn(true); setLoginError('');
        try {
          const res = await callApi('login', { id_user: loginId.trim(), password: loginPassword.trim() });

          if (res && res.status === 'success') {
            const safeUser = { ...res.user };
            delete safeUser.password;
            delete safeUser.PASSWORD;
            
            localStorage.setItem('clq_app_user', JSON.stringify(safeUser));

            // Akun yang wajib ganti password: tampilkan layar ganti password,
            // jangan langsung masuk ke aplikasi.
            if (res.wajib_ganti_password) {
              setPwLama(loginPassword.trim());
              setPerluGantiPassword(true);
              setIsLoggingIn(false);
              return;
            }

            // Teruskan token ke APK (kalau dibuka lewat aplikasi Android) supaya
            // pelacakan latar belakang bisa dimulai.
            kirimKredensialKeAndroid();

            // Pop-up "login di perangkat ini" DIHAPUS (permintaan pemilik, 19 Okt):
            // tampilannya mengganggu petugas tiap login. Datanya tetap dikirim server
            // (login_hp_baru) kalau suatu saat perlu ditampilkan lagi di tempat lain.

            setAppUser(safeUser);
            setUser({ uid: 'session-active' });
            requestWakeLock();

            // posisi tidak dikirim di sini — sudah ditangani pengawas GPS
            // berkala (watchPosition) setelah appUser terpasang.
          } else { setLoginError(res?.message || 'Login gagal. Periksa ID dan Password Anda.'); }
        } catch (error) {
          // tampilkan pesan sebenarnya dari server, bukan pesan generik.
          // Sebelumnya kegagalan apa pun tertulis "Koneksi server terputus"
          // sehingga masalah seperti kuota server habis jadi tidak terlihat.
          setLoginError(error.message || 'Koneksi server terputus. Pastikan ada internet.');
        } finally { setIsLoggingIn(false); }
      };

      const handleGantiPassword = async (e) => {
        e.preventDefault();
        setPwError(''); setPwSukses('');
        if (pwBaru.length < 8) { setPwError('Password baru minimal 8 karakter.'); return; }
        if (pwBaru !== pwUlang) { setPwError('Konfirmasi password tidak sama.'); return; }
        if (pwBaru === pwLama)  { setPwError('Password baru tidak boleh sama dengan yang lama.'); return; }
        setSedangGanti(true);
        try {
          const r = await panggilApi('/api/mobile/ganti-password', {
            method: 'POST',
            body: { lama: pwLama, baru: pwBaru, ulang: pwUlang },
          });
          if (r && r.status === 'success') {
            setPwSukses(r.message || 'Password berhasil diganti.');
            setPwLama(''); setPwBaru(''); setPwUlang('');
            setTimeout(() => { setPerluGantiPassword(false); setPwSukses(''); }, 1200);
          } else {
            setPwError((r && r.message) || 'Gagal mengganti password.');
          }
        } catch (err) {
          setPwError(err.message || 'Koneksi ke server gagal.');
        } finally { setSedangGanti(false); }
      };

      const executeLogout = () => { 
        setAppUser(null); 
        localStorage.removeItem('clq_app_user'); 
        setLoginId(''); 
        setLoginPassword(''); 
        window.location.reload(); 
      };

      const handleLogout = async () => { 
        const currentQueue = await getIDBQueue();
        if (currentQueue.length > 0) {
          if (isOffline) {
            showNotification('confirm', 'Mode Offline Aktif', `Ada ${currentQueue.length} kunjungan belum terkirim di IndexedDB. Yakin keluar?`, executeLogout);
            return;
          } else {
            showNotification('info', 'Menyinkronkan...', 'Sedang mengirim data offline...');
            await syncOfflineQueue();
            const remaining = await getIDBQueue();
            if (remaining.length > 0) {
               showNotification('confirm', 'Gagal Kirim', `Masih ada ${remaining.length} data gagal terkirim. Tetap keluar?`, executeLogout);
               return;
            } else closeNotification();
          }
        }
        executeLogout();
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        if (!userFormData.foto_user) { showNotification('warning', 'Data Wajib', 'Foto Profil wajib diisi!'); return; }
        setIsSavingUser(true);
        try {
          const mappedData = { 
            "ID_USER": userFormData.id_user, 
            "NAMA_USER": userFormData.nama_user, 
            "LEVEL_USER": userFormData.level_user, 
            "JABATAN": userFormData.jabatan || '', 
            "LAT": userFormData.lat || '', 
            "LON": userFormData.lon || '', 
            "LAST_UPDATE": userFormData.last_update || '', 
            "FOTO_USER": userFormData.foto_user || '' 
          };
          
          if (userFormData.password && userFormData.password.trim() !== "") {
             mappedData["PASSWORD"] = userFormData.password.trim();
          }

          const res = await callApi('edit_user', { data: mappedData });
          
          if (res && res.status === 'success') {
            showNotification('success', 'Sukses', "Profil berhasil diperbarui!"); 
            setShowUserForm(false);
            
            const updatedUser = { 
              ...appUser, 
              id_user: userFormData.id_user,
              nama_user: userFormData.nama_user,
              level_user: userFormData.level_user,
              jabatan: userFormData.jabatan,
              foto_user: userFormData.foto_user 
            };
            
            delete updatedUser.PASSWORD;
            delete updatedUser.password;
            localStorage.setItem('clq_app_user', JSON.stringify(updatedUser));
            setAppUser(updatedUser);
          } else throw new Error(res?.message || 'Gagal menyimpan profil.');
        } catch (error) { showNotification('error', 'Gagal', error.message); } finally { setIsSavingUser(false); }
      };

      const handleGlobalRefresh = () => {
        if (activeTab === 'dashboard') {
          fetchDashboardData();
        } else if (activeTab === 'visit' || activeTab === 'visit_form') {
          fetchVisitData();
        } else if (activeTab === 'users') {
          if (!isOffline && offlineQueue.length > 0) syncOfflineQueue();
        }
      };

      // Tidak ada lagi autentikasi Firebase. Sesi ditentukan oleh token
      // perangkat yang disimpan di localStorage setelah login ke server CLQ.
      // `user` tetap diisi supaya bagian lain aplikasi yang memeriksa
      // user.uid !== 'mode-sandbox' tidak perlu diubah semua.
      useEffect(() => {
        const token = (() => { try { return localStorage.getItem('clq_token'); } catch (e) { return null; } })();
        setUser(token ? { uid: 'session-active' } : { uid: 'mode-sandbox' });
      }, []);

      useEffect(() => {
        const initOfflineQueue = async () => {
          const currentQueue = await getIDBQueue();
          setOfflineQueue(currentQueue);
        };
        initOfflineQueue();

        const handleOnline = () => setIsOffline(false); const handleOffline = () => setIsOffline(true);
        window.addEventListener('online', handleOnline); window.addEventListener('offline', handleOffline);
        return () => { window.removeEventListener('online', handleOnline); window.removeEventListener('offline', handleOffline); };
      }, []);

      useEffect(() => { if (!isOffline && offlineQueue.length > 0 && !isSyncing) syncOfflineQueue(); }, [isOffline, offlineQueue.length]);

      // Ambil laporan sekali setelah petugas login / setelah kunjungan tersimpan,
      // supaya daftar Riwayat Visit langsung berisi (default 7 hari).
      // Dijaga ref agar tidak berulang setiap render (mencegah baca D1 sia-sia).
      const laporanSudahDiambil = useRef(false);
      useEffect(() => {
        if (!appUser || laporanSudahDiambil.current) return;
        laporanSudahDiambil.current = true;
        handleFetchReport();
        handleFetchBayar();
      }, [appUser]);

      // ============================================================
      // BANNER "INSTAL" — KHUSUS iOS
      //
      // Alasan: aplikasi ini akan dirilis sebagai APK Android, jadi tidak perlu
      // mengajak pengguna Android memasang versi web. Di Android banner juga
      // muncul setiap kali aplikasi dibuka dan mengganggu petugas.
      // Di iOS (iPhone/iPad) TIDAK ada APK, jadi di sanalah ajakan "Pasang di
      // layar utama" justru berguna.
      //
      // Banner juga tidak muncul lagi setelah petugas menekan X (diingat 60 hari)
      // atau setelah aplikasi benar-benar terpasang.
      // ============================================================
      const hanyaIOS = () => {
        const ua = navigator.userAgent || '';
        const ios = /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS 13+
        const android = /Android/i.test(ua);
        return ios && !android;
      };
      const sudahTerpasang = () =>
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;

      useEffect(() => {
        if (!hanyaIOS()) return;                      // Android/desktop: tidak pernah tampil
        if (sudahTerpasang()) return;                 // sudah dipasang: tidak perlu ajakan
        try {
          const tolak = localStorage.getItem('clq_instal_ditolak');
          if (tolak && Date.now() - Number(tolak) < 60 * 24 * 3600 * 1000) return;
        } catch (e) { /* mode privat */ }

        // Safari iOS TIDAK pernah mengirim `beforeinstallprompt`, jadi banner
        // tidak boleh bergantung pada event itu — kalau bergantung, bannernya
        // tidak akan pernah muncul di iPhone.
        setShowInstallBanner(true);

        const sudahDipasang = () => {
          setShowInstallBanner(false);
          setDeferredPrompt(null);
        };
        window.addEventListener('appinstalled', sudahDipasang);

        // sembunyikan otomatis kalau petugas memasang lewat menu Bagikan
        const lepas = window.matchMedia('(display-mode: standalone)');
        const cekMode = () => { if (lepas.matches) setShowInstallBanner(false); };
        if (lepas.addEventListener) lepas.addEventListener('change', cekMode);

        return () => {
          window.removeEventListener('appinstalled', sudahDipasang);
          if (lepas.removeEventListener) lepas.removeEventListener('change', cekMode);
        };
      }, []);

      const handleInstallClick = async () => {
        if (!deferredPrompt) return;
        setShowInstallBanner(false);
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') { console.log('PWA Accepted'); }
        setDeferredPrompt(null);
      };

      useEffect(() => {
        if (!appUser || !user) return;

        // ================================================================
        // GPS BERKELANJUTAN
        //
        // Versi lama: getCurrentPosition tiap 60 detik, tulis ke Firebase
        // `routes` (menumpuk ~8.600 dokumen/hari -> kuota gratis habis dan
        // errornya ditelan `.catch(e=>{})` sehingga petugas tidak sadar GPS
        // berhenti terkirim).
        //
        // Sekarang: watchPosition memberi posisi setiap kali HP bergerak,
        // lalu dikirim ke server paling cepat sekali per KIRIM_TIAP_MS.
        // Server yang menentukan mana yang disimpan sebagai titik jejak,
        // jadi kiriman sering tidak membebani database.
        // ================================================================
        const KIRIM_TIAP_MS = 45000;   // jangan lebih sering dari ini
        let terakhirKirim = 0;
        let posisiTerakhir = null;
        let pengawas = null;
        let dibatalkan = false;

        const kirimKalauPerlu = async (paksa = false) => {
          if (dibatalkan || !posisiTerakhir || isOffline) return;
          const sekarang = Date.now();
          if (!paksa && (sekarang - terakhirKirim) < KIRIM_TIAP_MS) return;
          terakhirKirim = sekarang;

          try {
            const baterai = await ambilBaterai();
            const hasil = await kirimPosisi({ ...posisiTerakhir, baterai, sumber: 'watch' });
            if (hasil && hasil.status === 'success') {
              setStatusGps({ ok: true, waktu: new Date(), pesan: 'Terkirim' });
              // titik tersimpan untuk antrean offline (kalau sinyal hilang)
              try { localStorage.setItem('clq_posisi_terakhir', JSON.stringify({ ...posisiTerakhir, waktu: new Date().toISOString() })); } catch (e) {}
            } else {
              setStatusGps({ ok: false, waktu: new Date(), pesan: (hasil && hasil.message) || 'Gagal terkirim' });
            }
          } catch (e) {
            // TIDAK ditelan diam-diam: status ditampilkan ke petugas
            setStatusGps({ ok: false, waktu: new Date(), pesan: e.message || 'Gagal terkirim' });
          }
        };

        if ("geolocation" in navigator) {
          pengawas = navigator.geolocation.watchPosition(
            (pos) => {
              posisiTerakhir = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                akurasi: pos.coords.accuracy ?? null,
              };
              setStatusGps((s) => ({ ...s, pesan: s.ok ? s.pesan : 'Menunggu kiriman…' }));
              kirimKalauPerlu();
            },
            (err) => {
              setStatusGps({ ok: false, waktu: new Date(), pesan: 'GPS tidak aktif: ' + (err.message || 'izin ditolak') });
            },
            { enableHighAccuracy: true, timeout: 20000, maximumAge: 15000 }
          );
        } else {
          setStatusGps({ ok: false, waktu: new Date(), pesan: 'HP tidak mendukung GPS' });
        }

        // pengiriman berkala (kalau posisi tidak berubah tapi waktu berjalan)
        const interval = setInterval(() => kirimKalauPerlu(true), KIRIM_TIAP_MS);

        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible') {
            kirimKalauPerlu(true);
            // HP kembali dibuka: minta posisi terbaru segera
            if ("geolocation" in navigator) {
              navigator.geolocation.getCurrentPosition(
                (pos) => {
                  posisiTerakhir = {
                    lat: pos.coords.latitude, lng: pos.coords.longitude,
                    akurasi: pos.coords.accuracy ?? null,
                  };
                  kirimKalauPerlu(true);
                }, () => {}, { enableHighAccuracy: true, timeout: 15000 }
              );
            }
          }
        };
        document.addEventListener('visibilitychange', handleVisibilityChange);

        // kirim titik yang tersimpan saat offline (kalau ada)
        (async () => {
          try {
            const tersimpan = localStorage.getItem('clq_posisi_terakhir');
            if (tersimpan && !isOffline) {
              const t = JSON.parse(tersimpan);
              const umurJam = (Date.now() - new Date(t.waktu).getTime()) / 3600000;
              if (umurJam < 6) {
                await panggilApi('/api/mobile/posisi', { method: 'POST', body: {
                  lat: t.lat, lon: t.lng, akurasi: t.akurasi, sumber: 'watch',
                }});
              }
            }
          } catch (e) {}
        })();

        return () => {
            dibatalkan = true;
            clearInterval(interval);
            document.removeEventListener('visibilitychange', handleVisibilityChange);
            if (pengawas !== null && "geolocation" in navigator) {
              navigator.geolocation.clearWatch(pengawas);
            }

                  <div><label className="text-[10px] uppercase tracking-wider font-bold text-slate-400">Rukos <span className="text-red-500">*</span></label><div className="relative mt-1.5"><select value={visitFormData["RUKOS"]} onChange={(e) => setVisitFormData(p => ({...p, "RUKOS": e.target.value}))} className="w-full px-4 py-3.5 bg-slate-50/50 border border-slate-200 rounded-2xl text-slate-700 font-bold text-sm focus:ring-2 focus:ring-blue-500 outline-none appearance-none cursor-pointer transition-all"><option value="">-- Pilih --</option>{parameters.rukos.map(opt => <option key={opt} value={opt}>{opt}</option>)}</select><ChevronDown className="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none" /></div></div>

                    <label className="text-[10px] uppercase tracking-wider font-bold text-slate-400 mb-2 block">Foto Tindakan <span className="font-normal text-gray-400">(Opsional)</span></label>
                    {visitFormData["FOTO TINDAKAN"] ? (
                      <div className="relative w-full rounded-2xl overflow-hidden border-2 border-blue-100 shadow-sm bg-slate-900 flex items-center justify-center">
                        <img src={visitFormData["FOTO TINDAKAN"]} alt="Preview Tindakan" className="w-full object-contain aspect-[3/4]" />
                        <button type="button" onClick={() => bukaKamera("FOTO TINDAKAN")} className="absolute bottom-4 right-4 bg-blue-600 text-white px-4 py-3 rounded-xl text-sm font-black cursor-pointer hover:bg-blue-700 flex items-center gap-2 shadow-lg active:scale-95 transition-all"><Camera className="w-5 h-5"/> Ganti</button>
                      </div>
                    ) : (
                      <button type="button" onClick={() => bukaKamera("FOTO TINDAKAN")} className="w-full bg-slate-50 border-2 border-dashed border-slate-300 rounded-[2rem] px-4 py-16 flex flex-col justify-center items-center gap-3 cursor-pointer hover:bg-blue-50/50 hover:border-blue-400 transition-colors aspect-[3/4]"><Camera className="w-12 h-12 text-slate-400 transition-colors" /><span className="text-sm font-bold text-slate-500 transition-colors">Ambil Foto Tindakan</span></button>
                    )}
                  </div>

                <div className="flex flex-col gap-3 pt-2">
                  <button onClick={submitVisitForm} disabled={isSavingVisitForm} className="w-full bg-blue-600 text-white font-black py-4 rounded-2xl text-sm uppercase tracking-widest shadow-lg shadow-blue-200 flex justify-center items-center gap-2 active:scale-95 transition-all disabled:bg-blue-300 cursor-pointer">
                    {isSavingVisitForm ? <span className="flex items-center gap-2"><Loader2 className="w-5 h-5 animate-spin"/> Menyimpan...</span> : <span className="flex items-center gap-2"><Save className="w-5 h-5" /> Simpan Visit</span>}
                  </button>
                  <button onClick={() => { setActiveTab('visit'); setActiveVisitCustomer(null); }} className="w-full bg-white border-2 border-red-100 text-red-600 font-black py-4 rounded-2xl text-sm uppercase tracking-widest flex justify-center items-center gap-2 hover:bg-red-50 transition-colors cursor-pointer"><X className="w-5 h-5" /> Batal</button>
                </div>
              </div>
            )}

            {activeTab === 'users' && (
              <div className="space-y-4 animate-in slide-in-from-right-4 duration-300 pb-28">
                <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 flex flex-col items-center text-center">
                   <div className="w-24 h-24 rounded-full overflow-hidden border-4 border-slate-50 shadow-md mb-4 bg-slate-50">
                     {(appUser?.foto_user || appUser?.['foto user'] || appUser?.foto || appUser?.photo) ? (
                         <img src={appUser.foto_user || appUser['foto user'] || appUser.foto || appUser.photo} alt="Profil" className="w-full h-full object-cover" />
                     ) : (<div className="w-full h-full bg-blue-600 text-white flex items-center justify-center font-black text-5xl">{(getUserName(appUser) || "P").charAt(0).toUpperCase()}</div>)}
                   </div>
                   <h2 className="text-xl font-black text-slate-800">{getUserName(appUser) || "Tanpa Nama"}</h2>
                   <p className="text-sm font-bold text-blue-600 tracking-widest mb-1">{getUserId(appUser)}</p>
                   <p className="text-xs text-slate-400 font-bold uppercase tracking-wider">{appUser?.jabatan || appUser?.posisi || 'Petugas Lapangan'}</p>

                   <div className="w-full mt-8 flex flex-col gap-3">
                      <button onClick={() => { 
                          setUserFormData({ id_user: getUserId(appUser), nama_user: getUserName(appUser), password: '', level_user: String(getUserLevel(appUser)), jabatan: appUser.jabatan || '', lat: appUser.lat || '', lon: appUser.lon || '', last_update: appUser.last_update || '', foto_user: appUser.foto_user || appUser['foto user'] || '' }); 
                          setShowUserForm(true); 
                      }} className="w-full bg-amber-50 hover:bg-amber-100 text-amber-700 font-black py-4 rounded-2xl text-sm uppercase tracking-widest flex justify-center items-center gap-2 transition-colors cursor-pointer">
                        <Edit className="w-5 h-5" /> Edit Profil Saya
                      </button>
                   </div>
                </div>
              </div>
            )}

          </main>

          <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-slate-100 px-4 py-4 flex justify-around items-center z-[999999] rounded-t-[2.5rem] shadow-[0_-10px_30px_rgba(0,0,0,0.05)] transition-all">
            <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center gap-1 transition-all hover:scale-110 cursor-pointer ${activeTab === 'dashboard' ? 'text-blue-600 scale-110 drop-shadow-sm font-bold' : 'text-slate-400 font-medium'}`}><LayoutDashboard className="w-5 h-5" /><span className="text-[10px] uppercase tracking-tighter">Beranda</span></button>
            <button onClick={() => setActiveTab('visit')} className={`flex flex-col items-center gap-1 transition-all hover:scale-110 cursor-pointer ${(activeTab === 'visit' || activeTab === 'visit_form') ? 'text-blue-600 scale-110 drop-shadow-sm font-bold' : 'text-slate-400 font-medium'}`}><MapPin className="w-5 h-5" /><span className="text-[10px] uppercase tracking-tighter">Visit</span></button>
            <button onClick={() => setActiveTab('users')} className={`flex flex-col items-center gap-1 transition-all hover:scale-110 cursor-pointer ${activeTab === 'users' ? 'text-blue-600 scale-110 drop-shadow-sm font-bold' : 'text-slate-400 font-medium'}`}><UserCircle className="w-5 h-5" /><span className="text-[10px] uppercase tracking-tighter">Profil</span></button>
          </nav>
        </div>
        <LapisanKamera />
        </>
      );
    }

    // ============================================================
    // PENGAMAN RENDER (19 Okt)
    //
    // Terbukti: setelah login, membuka ulang aplikasi menghasilkan layar KOSONG
    // tanpa pesan apa pun (galat React #321 "Invalid hook call" tertelan).
    // Petugas tidak tahu apa yang salah dan mengira aplikasi rusak.
    //
    // Blok ini menjamin: bila render gagal, layar menampilkan pesan dan tombol
    // pemulihan, BUKAN halaman putih. Ini jaring pengaman, bukan perbaikan akar.
    // ============================================================
    const tampilkanPemulihan = (pesan) => {
      try {
        const rootEl = document.getElementById('root');
        if (!rootEl) return;
        rootEl.innerHTML =
          '<div style="font-family:system-ui,sans-serif;padding:28px;max-width:430px;margin:0 auto">' +
          '<h2 style="color:#b91c1c;font-size:18px;margin:0 0 10px">Aplikasi gagal dimuat</h2>' +
          '<p style="color:#475569;font-size:13px;line-height:1.6;margin:0 0 6px">' + String(pesan || 'Kesalahan tidak diketahui') + '</p>' +
          '<p style="color:#94a3b8;font-size:12px;line-height:1.6;margin:0 0 20px">' +
          'Bila data kunjungan belum terkirim, JANGAN tutup aplikasi. Catat dulu di kertas lalu hubungi admin.</p>' +
          '<button id="btnMuatUlang" style="width:100%;background:#2563eb;color:#fff;border:0;padding:14px;border-radius:14px;font-weight:800;font-size:13px;letter-spacing:.5px;margin-bottom:10px">MUAT ULANG</button>' +
          '<button id="btnBersihkan" style="width:100%;background:#f1f5f9;color:#334155;border:0;padding:14px;border-radius:14px;font-weight:700;font-size:13px">MASUK ULANG (hapus data lokal)</button>' +
          '</div>';
        document.getElementById('btnMuatUlang').onclick = () => location.reload();
        document.getElementById('btnBersihkan').onclick = () => {
          try { localStorage.clear(); } catch (e) {}
          location.reload();
        };
      } catch (e) { /* tidak boleh melempar lagi */ }
    };

    // Galat global: tangkap yang lolos dari React.
    window.addEventListener('error', (ev) => {
      if (document.getElementById('root').innerHTML.trim() === '') {
        tampilkanPemulihan(ev.message || 'Galat saat memuat');
      }
    });
    window.addEventListener('unhandledrejection', (ev) => {
      if (document.getElementById('root').innerHTML.trim() === '') {
        const r = ev.reason;
        tampilkanPemulihan((r && r.message) || 'Galat saat memuat data');
      }
    });

    try {
      const root = createRoot(document.getElementById('root'));
      root.onRecoverableError = (e) => {
        console.error('Render pulih:', e);
        if (document.getElementById('root').innerHTML.trim() === '') {
          tampilkanPemulihan((e && e.message) || 'Galat saat menampilkan halaman');
        }
      };
      root.render(<MobileApp />);

      // Jaring terakhir: bila setelah 4 detik layar masih benar-benar kosong,
      // tampilkan pemulihan. Cukup murah dan hanya menyentuh kondisi gagal.
      setTimeout(() => {
        const el = document.getElementById('root');
        if (el && el.innerHTML.trim() === '') {
          tampilkanPemulihan('Halaman tidak dapat ditampilkan.');
        }
      }, 4000);
    } catch (e) {
      tampilkanPemulihan((e && e.message) || 'Galat saat memulai aplikasi');
    }
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" })
          .then(reg => {
            console.log("Service Worker Active!", reg);
            // Paksa periksa pembaruan setiap aplikasi dibuka. Tanpa ini, HP
            // bisa memakai versi lama berhari-hari walau versi baru sudah
            // di-upload — dan petugas tetap melihat perilaku lama.
            reg.update();
          })
          .catch(err => console.log("Service Worker Failed", err));

        // Kalau service worker baru mengambil alih, muat ulang sekali supaya
        // kode baru langsung dipakai. Dijaga supaya tidak berputar terus.
        let sudahMuatUlang = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (sudahMuatUlang) return;
          sudahMuatUlang = true;
          window.location.reload();
        });
      });
    }
  </script>

  <script>
    // Jalankan aplikasi secara eksplisit: transformasi JSX lalu eksekusi.
    // Semua galat ditampilkan di layar — jangan sampai putih tanpa penjelasan.
    (function () {
      function tampilkanGalat(pesan) {
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML =
          '<div style="font-family:sans-serif;padding:28px;max-width:420px;margin:0 auto">' +
          '<h2 style="color:#b91c1c;font-size:18px">Aplikasi gagal dimuat</h2>' +
          '<p style="color:#475569;font-size:13px;line-height:1.6">' + pesan + '</p>' +
          '<p style="color:#94a3b8;font-size:12px;margin-top:16px">Coba muat ulang halaman. ' +
          'Bila tetap gagal, kirimkan tulisan ini ke admin.</p></div>';
      }

      function jalan() {
        try {
          if (typeof Babel === 'undefined') {
            tampilkanGalat('Pustaka penerjemah (Babel) tidak termuat. Periksa koneksi ke server.');
            return;
          }
          var el = document.getElementById('kodeAplikasi');
          var kode = el.textContent;
          var hasil = Babel.transform(kode, {
            presets: [['react', { runtime: 'classic' }]],
            filename: 'aplikasi.jsx',
            sourceType: 'module',
          });
          var blob = new Blob([hasil.code], { type: 'text/javascript' });
          var mod = document.createElement('script');
          mod.type = 'module';
          mod.src = URL.createObjectURL(blob);
          mod.onerror = function () { tampilkanGalat('Berkas aplikasi gagal dijalankan.'); };
          document.body.appendChild(mod);
        } catch (e) {
          tampilkanGalat('Galat saat memuat aplikasi: ' + (e && e.message ? e.message : e));
        }
      }

      // Babel dimuat SETELAH kode aplikasi ada di DOM.
      var s = document.createElement('script');
      s.src = '/vendor/babel.min.js';
      s.onload = jalan;
      s.onerror = function () { tampilkanGalat('Pustaka penerjemah (Babel) gagal diunduh.'); };
      document.body.appendChild(s);
    })();
  </script>
</body>
