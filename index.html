    const VISIT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbzhWlW0vJyH5MjWw5R565AQ9PVxVKKX5x8Yu59ReKrxZN20q8uweEtsHVmrGlxDnZBR/exec";
    const VISIT_ACTION_NAME = "update_visit";

    const IDB_NAME = 'ColeqOfflineDB';
    const IDB_VERSION = 1;
    const IDB_STORE = 'offline_visits';

    const openIDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(IDB_NAME, IDB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE, { keyPath: 'id', autoIncrement: true });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const getIDBQueue = async () => {
      try {
        const db = await openIDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const store = tx.objectStore(IDB_STORE);
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      } catch (err) { return []; }
    };

    const addIDBItem = async (item) => {
      const db = await openIDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        const store = tx.objectStore(IDB_STORE);
        const req = store.add(item);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };

    const updateIDBItem = async (item) => {
      const db = await openIDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        const store = tx.objectStore(IDB_STORE);
        const req = store.put(item);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };

    const deleteIDBItem = async (id) => {
      const db = await openIDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        const store = tx.objectStore(IDB_STORE);
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    };

    const getAcct = (r) => {
      if (!r) return null;
      let val = r.acctno || r.no_rekening || r.account_no || r.rekening || r['no rekening'] || r['no. rekening'] || r['acct no'] || r['nomor rekening'] || r.norek || r.account || r.fasilitas || r['no fasilitas'] || r.no_fasilitas || r['no. rek'] || r['no rek'] || r.loan || r['no loan'];
      return val ? String(val).trim() : null;
    };
    const getUserId = (r) => {
      if (!r) return "";
      let val = r.id_user || r.petugas || r.id || r['id petugas'] || r.userid || r['user id'] || r.username;
      return val ? String(val).trim() : "";
    };
    const getUserName = (r) => {
      if (!r) return "";
      let val = r.nama_user || r.nama || r.name || r.nama_petugas || r['nama petugas'] || r['nama lengkap'] || r.sname || r.nama_debitur || r['nama debitur'];
      return val ? String(val).trim() : "";
    };
    const getUserLevel = (r) => {
      if (!r) return 3;
      let val = r.level_user || r.level || r.role || r.hak_akses || r['hak akses'];
      return (val !== undefined && val !== "") ? Number(val) : 3;
    };
    
    const stripDecimals = (str) => {
        let val = String(str).trim();
        if (val.endsWith('.00')) val = val.slice(0, -3);
        if (val.endsWith(',00')) val = val.slice(0, -3);
        if (val.startsWith('(') && val.endsWith(')')) val = '-' + val.slice(1, -1);
        return val;
    };

    const parseNominal = (val) => {
        let str = stripDecimals(val || '0');
        const isNeg = str.includes('-');
        const num = parseInt(str.replace(/[^0-9]/g, ''), 10) || 0;
        return isNeg ? -num : num;
    };

    const formatUang = (val) => {
        if (val === null || val === undefined || val === '-' || val === '') return '-';
        let str = stripDecimals(val);
        const isNeg = str.includes('-');
        const num = parseInt(str.replace(/[^0-9]/g, ''), 10) || 0;
        if (num === 0 && !str.includes('0')) return '-'; 
        return isNeg ? `-${num.toLocaleString('id-ID')}` : num.toLocaleString('id-ID');
    };

    const formatWhatsAppNumber = (phone) => {
      if (!phone) return null;
      let cleaned = phone.toString().replace(/\D/g, '');
      if (cleaned.startsWith('0')) cleaned = '62' + cleaned.substring(1);
      else if (!cleaned.startsWith('62')) cleaned = '62' + cleaned;
      return cleaned;
    };
    const getCurrentDateTime = () => {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    };

    const getLocalDateStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const getDisplayImageUrl = (url) => {
      if (!url) return '';
      if (url.startsWith('data:image')) return url;
      if (url.includes('drive.google.com')) {
        const idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
        if (idMatch && idMatch[1]) {
          return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w1200`;
        }
      }
      return url;
    };

    // Helper panggil JSON API GAS
    const callApi = async (action, payload = {}) => {
      for (let i = 0; i < 3; i++) {
        try {
          const response = await fetch(VISIT_WEBAPP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ token: APP_SECRET_TOKEN, action, ...payload })
          });
          const textRes = await response.text();
          let jsonRes;
          try { jsonRes = JSON.parse(textRes); } catch(e) { jsonRes = null; }
          if (!jsonRes) throw new Error("Format respon server tidak valid/Timeout. Silakan ulangi.");
          return jsonRes;
        } catch (error) {
          if (i === 2) throw error;
          await new Promise(res => setTimeout(res, 2000 * (i + 1))); 
        }
      }
    };

    function MobileApp() {
      const [user, setUser] = useState(null);
      const [appUser, setAppUser] = useState(() => {
        try {
          const saved = localStorage.getItem('clq_app_user');
          return saved ? JSON.parse(saved) : null;
        } catch(e) { return null; }
      }); 
      
      const [loginId, setLoginId] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);
      const [loginError, setLoginError] = useState('');

      const [activeTab, setActiveTab] = useState('dashboard');
      const [loading, setLoading] = useState(true);
      const [modalConfig, setModalConfig] = useState({ isOpen: false, type: 'info', title: '', message: '', onConfirm: null });

      const [showUserForm, setShowUserForm] = useState(false);
      const [userFormData, setUserFormData] = useState({ id_user: '', nama_user: '', password: '', level_user: '3', jabatan: '', lat: '', lon: '', last_update: '', foto_user: '' });
      const [isSavingUser, setIsSavingUser] = useState(false);

      const [visitData, setVisitData] = useState([]);
      const [isFetchingVisit, setIsFetchingVisit] = useState(false);
      const [activeVisitCustomer, setActiveVisitCustomer] = useState(null);
      const [visitFormData, setVisitFormData] = useState({});
      const [isSavingVisitForm, setIsSavingVisitForm] = useState(false);
      const [expandedVisitLokasi, setExpandedVisitLokasi] = useState({}); 

      const [locationData, setLocationData] = useState({ lat: null, lng: null, address: '', addressObj: null });
      const [dashboardStats, setDashboardStats] = useState({ target: 0, targetRp: 0, dikunjungi: 0, dikunjungiRp: 0, belum: 0, belumRp: 0 });
      const [priorityTasks, setPriorityTasks] = useState([]); 
      const [bayarData, setBayarData] = useState([]); 
      const [isFetchingStats, setIsFetchingStats] = useState(false);
      
      const [clusterName, setClusterName] = useState('Memuat...');
      const [parameters, setParameters] = useState({ kondisiRumah: [], bertemuDengan: [], rukos: [], tindakan: [], jabatan: [] });

      const [isOffline, setIsOffline] = useState(!navigator.onLine);
      const [offlineQueue, setOfflineQueue] = useState([]);
      const [isSyncing, setIsSyncing] = useState(false);

      const [reportData, setReportData] = useState([]);
      const [isFetchingReport, setIsFetchingReport] = useState(false);
      const [reportFilterDateStart, setReportFilterDateStart] = useState(() => getLocalDateStr());
      const [reportFilterDateEnd, setReportFilterDateEnd] = useState(() => getLocalDateStr());
      const [previewPhoto, setPreviewPhoto] = useState(null);
      const [expandedReportLokasi, setExpandedReportLokasi] = useState({});

      const [wakeLock, setWakeLock] = useState(null);
      const [isTrackingActive, setIsTrackingActive] = useState(false);

      const showNotification = (type, title, message, onConfirm = null) => setModalConfig({ isOpen: true, type, title, message, onConfirm });
      const closeNotification = () => setModalConfig({ ...modalConfig, isOpen: false });

      const groupedVisitData = useMemo(() => {
        const grouped = {};
        visitData.forEach(item => {
          const lokasi = item.lpdloc || item.lokasi || 'TIDAK DIKETAHUI';
          if (!grouped[lokasi]) grouped[lokasi] = [];
          grouped[lokasi].push(item);
        });
        return grouped;
      }, [visitData]);

      const toggleVisitLokasi = (lokasi) => setExpandedVisitLokasi(prev => ({ ...prev, [lokasi]: !prev[lokasi] }));

      const groupedReportData = useMemo(() => {
        const grouped = {};
        reportData.forEach(item => {
          const lokasi = item.lpdloc || item.lokasi || 'TIDAK DIKETAHUI';
          if (!grouped[lokasi]) grouped[lokasi] = [];
          grouped[lokasi].push(item);
        });
        return grouped;
      }, [reportData]);

      const toggleReportLokasi = (lokasi) => setExpandedReportLokasi(prev => ({ ...prev, [lokasi]: !prev[lokasi] }));

      const requestWakeLock = async () => {
        if ('wakeLock' in navigator) {
          try {
            const lock = await navigator.wakeLock.request('screen');
            lock.addEventListener('release', () => {
              setWakeLock(null);
              setIsTrackingActive(false);
            });
            setWakeLock(lock);
            setIsTrackingActive(true);
          } catch (err) {
            setWakeLock(null);
            setIsTrackingActive(false);
          }
        } else {
          setIsTrackingActive(false);
        }
      };

      const toggleTrackingMode = async () => {
        if (!isTrackingActive) {
          await requestWakeLock();
        } else {
          if (wakeLock !== null) {
            wakeLock.release().catch(()=>{});
          }
        }
      };

      useEffect(() => {
        const handleVisibilityChange = () => {
          if (document.visibilityState === 'visible' && appUser) {
             requestWakeLock();
          }
        };
        document.addEventListener('visibilitychange', handleVisibilityChange);
        if (appUser && document.visibilityState === 'visible') requestWakeLock();
        return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
      }, [appUser]);

      const handleProfilePhoto = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          showNotification('error', 'File Ditolak', 'Hanya format gambar yang diperbolehkan.');
          e.target.value = null; return;
        }
        try {
          let img;
          if (window.createImageBitmap) { img = await createImageBitmap(file, { imageOrientation: 'from-image' }); } 
          else {
            const dataUrl = await new Promise((resolve) => { const reader = new FileReader(); reader.onload = (ev) => resolve(ev.target.result); reader.readAsDataURL(file); });
            img = new Image(); await new Promise((resolve) => { img.onload = resolve; img.src = dataUrl; });
          }
          const size = Math.min(img.width, img.height);
          const startX = (img.width - size) / 2;
          const startY = (img.height - size) / 2;
          const canvas = document.createElement('canvas'); 
          canvas.width = 120; canvas.height = 120;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, startX, startY, size, size, 0, 0, 120, 120);
          setUserFormData(prev => ({...prev, foto_user: canvas.toDataURL('image/jpeg', 0.6)}));
          canvas.width = 0; canvas.height = 0;
        } catch (err) { showNotification('error', 'Gagal Memproses', 'Perangkat tidak mendukung.'); }
      };

      const handlePhoto = async (e, field) => {
        const file = e.target.files[0];
        if (!file) return;

        if (file.type.startsWith('image/')) {
          try {
            let img; let width, height;
            if (window.createImageBitmap) { img = await createImageBitmap(file, { imageOrientation: 'from-image' }); width = img.width; height = img.height; } 
            else {
              const dataUrl = await new Promise((resolve) => { const reader = new FileReader(); reader.onload = (ev) => resolve(ev.target.result); reader.readAsDataURL(file); });
              img = new Image(); await new Promise((resolve) => { img.onload = resolve; img.src = dataUrl; }); width = img.width; height = img.height;
            }

            const MAX_DIMENSION = 600; let scale = 1;
            if (width > height && width > MAX_DIMENSION) scale = MAX_DIMENSION / width;
            else if (height >= width && height > MAX_DIMENSION) scale = MAX_DIMENSION / height;

            const canvas = document.createElement('canvas'); canvas.width = width * scale; canvas.height = height * scale;
            const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            
            const watermarkHeight = canvas.height * 0.30; const blockHeight = watermarkHeight / 3; const startY = canvas.height - watermarkHeight; const padX = canvas.width * 0.04; 
            const fontFamily = 'Cairo, sans-serif'; ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 6; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2; 

            const fillTextFit = (text, x, y, maxWidth, initialFontSize, weight) => {
              let fontSize = initialFontSize; ctx.font = `${weight} ${fontSize}px ${fontFamily}`;
              while (ctx.measureText(text).width > maxWidth && fontSize > 8) { fontSize -= 0.5; ctx.font = `${weight} ${fontSize}px ${fontFamily}`; }
              ctx.fillText(text, x, y);
            };

            const logoUrl = "https://lh3.googleusercontent.com/d/1qDaQ3F_0RDvC8GY8JQ1AKMEFYiiB-sgy"; 
            const logoImg = new Image(); logoImg.crossOrigin = "Anonymous"; 
            await new Promise((resolve) => { logoImg.onload = resolve; logoImg.onerror = resolve; logoImg.src = logoUrl; });

            if (logoImg.complete && logoImg.naturalWidth !== 0) {
                const logoH = blockHeight * 0.7; const logoW = (logoImg.naturalWidth / logoImg.naturalHeight) * logoH; const logoY = startY + (blockHeight * 0.15); 
                ctx.drawImage(logoImg, padX, logoY, logoW, logoH);
            } else {
                ctx.font = `900 ${blockHeight * 0.5}px ${fontFamily}`; ctx.fillStyle = '#ffffff'; ctx.textBaseline = 'middle'; ctx.fillText('BANK BTN', padX, startY + (blockHeight / 2));
            }

            const block2Y = startY + blockHeight; const now = new Date();
            const jamStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const tglStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu']; const hariStr = days[now.getDay()];

            ctx.font = `700 ${blockHeight * 0.7}px ${fontFamily}`; ctx.fillStyle = '#ffffff'; ctx.textBaseline = 'middle'; ctx.fillText(jamStr, padX, block2Y + (blockHeight / 2));
            const lineX = padX + ctx.measureText(jamStr).width + (canvas.width * 0.03); 
            ctx.shadowColor = 'transparent'; ctx.beginPath(); ctx.moveTo(lineX, block2Y + (blockHeight * 0.2)); ctx.lineTo(lineX, block2Y + (blockHeight * 0.8)); ctx.lineWidth = Math.max(3, canvas.width * 0.006); ctx.strokeStyle = '#ef4444'; ctx.stroke();
            ctx.shadowColor = 'rgba(0,0,0,0.9)'; 

            const textX = lineX + (canvas.width * 0.03);
            ctx.font = `500 ${blockHeight * 0.3}px ${fontFamily}`; ctx.textBaseline = 'bottom'; ctx.fillText(tglStr, textX, block2Y + (blockHeight * 0.45)); 
            ctx.textBaseline = 'top'; ctx.fillText(hariStr, textX, block2Y + (blockHeight * 0.55)); 

            const block3Y = startY + (2 * blockHeight);
            let baris1 = "Lokasi tidak diketahui"; let baris2 = "Menunggu alamat..."; let baris3 = locationData.lat !== null && locationData.lat !== '-' ? `Lat: ${locationData.lat}, Lng: ${locationData.lng}` : "Sinyal GPS belum didapatkan...";

            if (locationData.address && !locationData.address.includes('Mencari') && !locationData.address.includes('Gagal')) {
                const parts = locationData.address.split(',').map(s => s.trim()).filter(Boolean);
                if (parts.length > 0) {
                    if (parts.length >= 4) { baris1 = `${parts[0]}, ${parts[1]}`; baris2 = parts.slice(2, -1).join(', '); } 
                    else if (parts.length > 1) { baris1 = parts[0]; baris2 = parts.slice(1, -1).length > 0 ? parts.slice(1, -1).join(', ') : parts[1]; } 
                    else { baris1 = parts[0]; baris2 = ""; }
                }
            } else if (locationData.lat !== null && locationData.lat !== '-') {
                 baris1 = "Jaringan lambat / Area tak terpetakan"; baris2 = "Periksa koneksi internet Anda.";
            }

            const maxTextW = canvas.width - (padX * 2);
            ctx.fillStyle = '#ffffff'; ctx.textBaseline = 'bottom'; fillTextFit(baris1, padX, block3Y + (blockHeight * 0.35), maxTextW, blockHeight * 0.28, '700');
            ctx.fillStyle = '#f8fafc'; ctx.textBaseline = 'top'; fillTextFit(baris2, padX, block3Y + (blockHeight * 0.40), maxTextW, blockHeight * 0.22, '400');
            ctx.fillStyle = '#fbbf24'; ctx.textBaseline = 'top'; fillTextFit(baris3, padX, block3Y + (blockHeight * 0.70), maxTextW, blockHeight * 0.20, '500');
            ctx.textBaseline = 'alphabetic';

            setVisitFormData(prev => ({...prev, [field]: canvas.toDataURL('image/jpeg', 0.5)}));
            canvas.width = 0; canvas.height = 0;

          } catch (err) { console.error(err); showNotification('error', 'Gagal Memproses Gambar', 'Pastikan perangkat dan browser mendukung.'); }
        } else { showNotification('error', 'File Ditolak', 'Hanya format Gambar.'); e.target.value = null; }
      };

      // API: FETCH PARAMETERS & CONFIG 
      const fetchAppConfigAndParams = async () => {
        try {
          const res = await callApi('get_parameters');
          if (res && res.status === 'success') {
             if (res.clusterName) setClusterName(res.clusterName);
             if (res.data && res.data.length > 0) {
                const rawData = res.data;
                setParameters({ 
                  kondisiRumah: [...new Set(rawData.map(r => r['kondisi rumah']).filter(Boolean))], 
                  bertemuDengan: [...new Set(rawData.map(r => r['bertemu dengan']).filter(Boolean))], 
                  rukos: [...new Set(rawData.map(r => r['rukos']).filter(Boolean))], 
                  tindakan: [...new Set(rawData.map(r => r['tindakan']).filter(Boolean))], 
                  jabatan: [...new Set(rawData.map(r => r['jabatan']).filter(Boolean))] 
                });
             }
          }
        } catch (err) { 
          console.warn("Gagal menarik config & parameter via API", err);
          if (clusterName === 'Memuat...') setClusterName('Cluster Quality');
        }
      };

      const fetchVisitData = async () => {
        if (!appUser) return;
        setIsFetchingVisit(true);
        try {
          const myId = getUserId(appUser).toUpperCase();
          const res = await callApi('get_visit_pending', { id_user: myId });
          
          if (res && res.status === 'success') {
             const pendingData = res.data || [];
             const resRindeb = await callApi('get_rindeb');
             const rawDataRindeb = (resRindeb && resRindeb.status === 'success') ? resRindeb.data : [];
             
             setVisitData(pendingData.map(visit => {
                const acctno = getAcct(visit);
                const matchRindeb = rawDataRindeb.find(r => getAcct(r) === acctno);
                return {
                  ...visit, acctno: acctno,
                  sname: matchRindeb ? getUserName(matchRindeb) : (getUserName(visit) || "Tanpa Nama"),
                  lpdloc: visit.lokasi || visit.lpdloc || (matchRindeb ? matchRindeb.lpdloc : "TIDAK DIKETAHUI"),
                  alamat_agunan: matchRindeb ? (matchRindeb.alamat_agunan || matchRindeb['alamat agunan'] || matchRindeb.alamat || "Tidak Ditemukan") : "Data Rindeb Tidak Ada",
                  hp1: matchRindeb ? (matchRindeb.hp1 || matchRindeb.hp || "") : "",
                  so_pokok_tdy: matchRindeb ? matchRindeb.so_pokok_tdy : "0",
                  kol_tdy: matchRindeb ? matchRindeb.kol_tdy : "-",
                  tgk_angsuran: matchRindeb ? (matchRindeb.tgk_angsuran || matchRindeb.tgl_angsuran) : (visit.tgk_angsuran || "0")
                };
             }));
          } else { throw new Error(res?.message || 'Server error'); }
        } catch (error) { showNotification('error', 'Gagal Memuat Data', error.message); } finally { setIsFetchingVisit(false); }
      };

      const fetchDashboardStats = async () => {
        if (!appUser) return;
        setIsFetchingStats(true);
        try {
          const myId = getUserId(appUser).toUpperCase();
          const [resStats, resPending, resBayar, resKelolaan] = await Promise.all([
             callApi('get_dashboard_stats'),
             callApi('get_visit_pending', { id_user: myId }),
             callApi('get_bayar'),
             callApi('get_kelolaan')
          ]);

          if (resStats?.status === 'success' && resStats.stats) setDashboardStats(resStats.stats);
          
          if (resPending?.status === 'success') {
             const pendingTasksList = (resPending.data || []).map(row => ({
                ...row,
                pokokVal: parseNominal(row.so_pokok_tdy || row.so_pokok || 0),
                kolVal: parseInt(String(row.kol_tdy || row.kol || '0').replace(/[^0-9]/g, ''), 10) || 0 
             }));
             setPriorityTasks(pendingTasksList.sort((a, b) => b.pokokVal !== a.pokokVal ? b.pokokVal - a.pokokVal : b.kolVal - a.kolVal).slice(0, 5));
          }
          
          if (resBayar?.status === 'success') {
             let myKelolaanAccts = new Set();
             if (resKelolaan?.status === 'success') {
                myKelolaanAccts = new Set(resKelolaan.data.filter(k => getUserId(k).toUpperCase() === myId).map(k => getAcct(k)).filter(Boolean));
             }

             const mappedBayar = (resBayar.data || []).filter(b => {
                const acct = getAcct(b);
                return acct && myKelolaanAccts.has(acct);
             }).map(b => ({
                acctno: getAcct(b),
                sname: getUserName(b) || "Tanpa Nama",
                lpdloc: b.lpdloc || b.lokasi || "-",
                kol_tdy: b.kol_tdy || b.kol || "-",
                so_pokok_tdy: b.so_pokok_tdy || b.pokok || b.nominal || b.amount || b.bayar || "0"
             }));
             setBayarData(mappedBayar);
          }
        } catch (err) { console.error(err); } finally { setIsFetchingStats(false); }
      };

      const handleFetchReport = async () => {
        if (!appUser) return;
        setIsFetchingReport(true);
        try {
          const myId = getUserId(appUser).toUpperCase();
          const res = await callApi('get_report', { date_from: reportFilterDateStart, date_to: reportFilterDateEnd, id_user: myId });
          
          if(res && res.status === 'success') {
             const rawReports = res.data || [];
             
             // PERBAIKAN: Menoleransi berbagai jenis header tanggal
             const getRawDate = (r) => r.tanggal || r['tanggal visit'] || r.tanggal_visit || r['tgl visit'] || '';
             
             rawReports.sort((a,b) => new Date(getRawDate(b) || 0) - new Date(getRawDate(a) || 0));
             
             setReportData(rawReports.map(visit => ({
                ...visit,
                acctno: getAcct(visit),
                sname: getUserName(visit) || "Tanpa Nama",
                lpdloc: visit.lokasi || visit.lpdloc || "TIDAK DIKETAHUI",
                alamat_agunan: visit.alamat_agunan || visit.alamat || "-",
                so_pokok_tdy: visit._rindeb_so_pokok || visit.so_pokok_tdy || "0",
                kol_tdy: visit._rindeb_kol || visit.kol_tdy || "-",
                tgk_angsuran: visit.tgk_angsuran || "0",
                tanggal: String(getRawDate(visit)).trim()
             })));
          } else {
             throw new Error(res?.message || 'Format JSON dari server rusak atau time-out.');
          }
        } catch(e) {
          showNotification('error', 'Gagal Memuat Laporan', e.message || 'Koneksi ke Apps Script terputus.');
        } finally {
          setIsFetchingReport(false);
        }
      };

      const submitVisitForm = async () => {
        const requiredFields = [
          { key: "KONDISI RUMAH", label: "Kondisi Rumah" }, 
          { key: "BERTEMU DENGAN", label: "Bertemu Dengan" }, 
          { key: "RUKOS", label: "Rukos" }, 
          { key: "TINDAKAN", label: "Tindakan" }, 
          { key: "CATATAN", label: "Catatan" }, 
          { key: "FOTO RUMAH", label: "Foto Rumah" }
        ];

        for (let field of requiredFields) {
          if (!visitFormData[field.key] || visitFormData[field.key].trim() === "") { 
            showNotification('warning', 'Data Belum Lengkap', `Mohon lengkapi kolom "${field.label}" terlebih dahulu.`); 
            return; 
          }
        }

        setIsSavingVisitForm(true);
        
        const finalVisitData = {
            ...visitFormData,
            "TANGGAL VISIT": visitFormData["TANGGAL"], 
            "TGL VISIT": visitFormData["TANGGAL"],
            "TANGGAL_VISIT": visitFormData["TANGGAL"],
            "LAT": (locationData && locationData.lat !== '-' && locationData.lat !== null) ? String(locationData.lat) : "",
            "LON": (locationData && locationData.lng !== '-' && locationData.lng !== null) ? String(locationData.lng) : ""
        };

        const payload = { action: VISIT_ACTION_NAME, visit_id: activeVisitCustomer['visit id'] || activeVisitCustomer.visit_id || '', data: finalVisitData };

        if (!isOffline && locationData && locationData.lat && locationData.lat !== '-' && user && user.uid !== 'mode-sandbox') {
          try {
            const timestamp = Date.now();
            const dateStr = getLocalDateStr(); 
            const userName = getUserName(appUser) || "Petugas";
            const userId = getUserId(appUser).toUpperCase(); 
            const visitTargetName = activeVisitCustomer.acctno + " - " + (activeVisitCustomer.sname || getUserName(activeVisitCustomer));
            
            addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'routes'), {
              userId, userName, lat: locationData.lat, lng: locationData.lng, 
              timestamp, dateStr, isVisit: true, visitTarget: visitTargetName
            }).catch(e => console.warn(e));

            setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'locations', userId), { 
              userId, userName, lat: locationData.lat, lng: locationData.lng, timestamp 
            }).catch(e => {});

          } catch(e) { console.warn("Gagal mencatat rute visit di peta", e); }
        }

        const saveToOfflineQueue = async () => {
          try {
            const currentQueue = await getIDBQueue();
            const existing = currentQueue.find(item => item.acctNo === visitFormData.ACCTNO);
            if (existing && existing.id !== undefined) {
              await deleteIDBItem(existing.id);
            }

            const idbItem = {
              acctNo: visitFormData.ACCTNO,
              payload: payload,
              createdAt: Date.now(),
              retryCount: 0
            };
            await addIDBItem(idbItem);
            const updatedQueue = await getIDBQueue();
            setOfflineQueue(updatedQueue);
            showNotification('info', 'Tersimpan Secara Offline', 'Koneksi terputus. Data disimpan aman di HP dan otomatis dikirim saat sinyal kembali.');
            setActiveTab('visit'); 
            setActiveVisitCustomer(null);
          } catch(e) {
            showNotification('error', 'Gagal Simpan Offline', e.message);
          }
        };

        if (isOffline) { await saveToOfflineQueue(); setIsSavingVisitForm(false); return; }

        try {
          const res = await callApi(VISIT_ACTION_NAME, { visit_id: payload.visit_id, data: payload.data });

          if (res && res.status === 'success') {
            showNotification('success', 'Visit Tersimpan', 'Data hasil kunjungan berhasil diunggah.');
            await fetchVisitData(); setActiveTab('dashboard'); setActiveVisitCustomer(null);
          } else throw new Error(res?.message || 'Format respon server tidak valid.');
        } catch (error) { 
          if (error.message && (error.message.includes("Failed to fetch") || error.message.includes("NetworkError") || error.message.includes("Unexpected token"))) await saveToOfflineQueue();
          else showNotification('error', 'Penyimpanan Gagal', error.message || 'Terdapat kesalahan pada jaringan.'); 
        } finally { setIsSavingVisitForm(false); }
      };

      const syncOfflineQueue = async () => {
        if (isSyncing || !navigator.onLine) return;
        const queue = await getIDBQueue();
        if (!queue || queue.length === 0) return;

        setIsSyncing(true); let successCount = 0;

        for (let i = 0; i < queue.length; i++) {
          const item = queue[i];
          try {
            const res = await callApi(item.payload.action, { visit_id: item.payload.visit_id, data: item.payload.data });

            if (res && res.status === 'success') { 
              successCount++; 
              if (item.id !== undefined) await deleteIDBItem(item.id);
            } else {
              const retries = (item.retryCount || 0) + 1;
              if (retries >= 3) {
                console.warn("Item antrean offline ditolak berulang kali oleh server, menghapus dari IndexedDB:", item);
                if (item.id !== undefined) await deleteIDBItem(item.id);
              } else {
                item.retryCount = retries;
                await updateIDBItem(item);
              }
            }
          } catch (err) { 
            break; 
          }
        }

        const remainingQueue = await getIDBQueue();
        setOfflineQueue(remainingQueue); setIsSyncing(false);

        if (successCount > 0) {
          showNotification('success', 'Sinkronisasi Selesai', `${successCount} data offline berhasil dikirim!`);
          if (activeTab === 'visit' || activeTab === 'dashboard') fetchVisitData(); 
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!loginId.trim() || !loginPassword.trim()) return;
        setIsLoggingIn(true); setLoginError('');
        try {
          const res = await callApi('login', { id_user: loginId.trim(), password: loginPassword.trim() });

          if (res && res.status === 'success') {
            const safeUser = { ...res.user };
            delete safeUser.password;
            delete safeUser.PASSWORD;
            
            localStorage.setItem('clq_app_user', JSON.stringify(safeUser));
            setAppUser(safeUser);
            requestWakeLock();

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;
                    const mappedData = { "ID_USER": getUserId(safeUser), "LAT": String(lat), "LON": String(lon), "LAST_UPDATE": getCurrentDateTime() };
                    callApi('edit_user', { data: mappedData }).catch(() => {});
                }, () => {}, { enableHighAccuracy: true });
            }
          } else { setLoginError(res?.message || 'Login gagal. Periksa ID dan Password Anda.'); }
        } catch (error) { setLoginError('Koneksi server terputus. Pastikan ada internet.'); } finally { setIsLoggingIn(false); }
      };

      const executeLogout = () => { 
        setAppUser(null); 
        localStorage.removeItem('clq_app_user'); 
        setLoginId(''); 
        setLoginPassword(''); 
        window.location.reload(); 
      };

      const handleLogout = async () => { 
        const currentQueue = await getIDBQueue();
        if (currentQueue.length > 0) {
          if (isOffline) {
            showNotification('confirm', 'Mode Offline Aktif', `Ada ${currentQueue.length} kunjungan belum terkirim di IndexedDB. Yakin keluar?`, executeLogout);
            return;
          } else {
            showNotification('info', 'Menyinkronkan...', 'Sedang mengirim data offline...');
            await syncOfflineQueue();
            const remaining = await getIDBQueue();
            if (remaining.length > 0) {
               showNotification('confirm', 'Gagal Kirim', `Masih ada ${remaining.length} data gagal terkirim. Tetap keluar?`, executeLogout);
               return;
            } else closeNotification();
          }
        }
        executeLogout();
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        if (!userFormData.foto_user) { showNotification('warning', 'Data Wajib', 'Foto Profil wajib diisi!'); return; }
        setIsSavingUser(true);
        try {
          const mappedData = { 
            "ID_USER": userFormData.id_user, 
            "NAMA_USER": userFormData.nama_user, 
            "LEVEL_USER": userFormData.level_user, 
            "JABATAN": userFormData.jabatan || '', 
            "LAT": userFormData.lat || '', 
            "LON": userFormData.lon || '', 
            "LAST_UPDATE": userFormData.last_update || '', 
            "FOTO_USER": userFormData.foto_user || '' 
          };
          
          if (userFormData.password && userFormData.password.trim() !== "") {
             mappedData["PASSWORD"] = userFormData.password.trim();
          }

          const res = await callApi('edit_user', { data: mappedData });
          
          if (res && res.status === 'success') {
            showNotification('success', 'Sukses', "Profil berhasil diperbarui!"); 
            setShowUserForm(false);
            
            const updatedUser = { 
              ...appUser, 
              id_user: userFormData.id_user,
              nama_user: userFormData.nama_user,
              level_user: userFormData.level_user,
              jabatan: userFormData.jabatan,
              foto_user: userFormData.foto_user 
            };
            
            delete updatedUser.PASSWORD;
            delete updatedUser.password;
            localStorage.setItem('clq_app_user', JSON.stringify(updatedUser));
            setAppUser(updatedUser);
          } else throw new Error(res?.message || 'Gagal menyimpan profil.');
        } catch (error) { showNotification('error', 'Gagal', error.message); } finally { setIsSavingUser(false); }
      };

      const handleGlobalRefresh = () => {
        fetchAppConfigAndParams();
        if (activeTab === 'dashboard') {
          fetchDashboardStats();
          handleFetchReport();
        } else if (activeTab === 'visit' || activeTab === 'visit_form') {
          fetchVisitData();
        } else if (activeTab === 'users') {
          if (!isOffline && offlineQueue.length > 0) syncOfflineQueue();
        }
      };

      useEffect(() => {
        let isMounted = true;
        const initAuth = async () => { 
            try { 
                await signInAnonymously(auth); 
            } catch (err) { 
                if (isMounted) { setUser({ uid: 'mode-sandbox' }); setLoading(false); }
            } 
        };
        initAuth(); 
        
        let unsubscribe = () => {};
        try {
            unsubscribe = onAuthStateChanged(auth, (u) => { 
                if (isMounted) {
                    if(u) { setUser(u); } 
                    else { setUser(prev => (prev && prev.uid === 'mode-sandbox') ? prev : { uid: 'mode-sandbox' }); }
                    setLoading(false); 
                }
            }); 
        } catch(e) {
            if(isMounted) { setUser({ uid: 'mode-sandbox' }); setLoading(false); }
        }

        return () => { isMounted = false; unsubscribe(); };
      }, []);

      useEffect(() => {
        const initOfflineQueue = async () => {
          const currentQueue = await getIDBQueue();
          setOfflineQueue(currentQueue);
        };

        initOfflineQueue();

        const handleOnline = () => setIsOffline(false); const handleOffline = () => setIsOffline(true);
        window.addEventListener('online', handleOnline); window.addEventListener('offline', handleOffline);
        return () => { window.removeEventListener('online', handleOnline); window.removeEventListener('offline', handleOffline); };
      }, []);

      useEffect(() => { if (!isOffline && offlineQueue.length > 0 && !isSyncing) syncOfflineQueue(); }, [isOffline, offlineQueue.length]);

      useEffect(() => {
        if (!appUser || !user) return;
        const pushLocationToCloud = async () => {
          if (isOffline) return; 
          if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition((pos) => {
              try {
                 const lat = pos.coords.latitude; const lng = pos.coords.longitude; 
                 const timestamp = Date.now(); 
                 const dateStr = getLocalDateStr(); 
                 const userName = getUserName(appUser) || "Petugas"; 
                 const userId = getUserId(appUser).toUpperCase(); 

                 if (!userId) return;

                 if (user.uid !== 'mode-sandbox') {
                    setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'locations', userId), { userId, userName, lat, lng, timestamp }).catch(e=>{});
                    addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'routes'), { userId, userName, lat, lng, timestamp, dateStr }).catch(e=>{});
                 }
                 
                 const mappedData = { "ID_USER": userId, "LAT": String(lat), "LON": String(lng), "LAST_UPDATE": getCurrentDateTime() };
                 callApi('edit_user', { data: mappedData }).catch(() => {});

              } catch (e) { console.error("Error push GPS", e) }
            }, () => {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
          }
        };
        
        pushLocationToCloud(); 
        const interval = setInterval(pushLocationToCloud, 60000); 
        
        const handleVisibilityChange = () => { if (document.visibilityState === 'visible') pushLocationToCloud(); };
        document.addEventListener('visibilitychange', handleVisibilityChange);

        return () => { 
            clearInterval(interval); 
            document.removeEventListener('visibilitychange', handleVisibilityChange);
        };
      }, [appUser, user, isOffline]);

      // Load initial config parameters (Menghapus total link CSV statis)
      useEffect(() => { fetchAppConfigAndParams(); }, []);

      useEffect(() => {
        if (activeTab === 'visit' || activeTab === 'visit_form') {
           if (parameters.kondisiRumah.length === 0) {
              fetchAppConfigAndParams();
           }
        }
      }, [activeTab]);

      useEffect(() => {
        if (activeTab === 'users' && appUser) {
          const currentPhoto = appUser.foto_user || appUser['foto user'] || appUser.foto || appUser.photo;
          if (!currentPhoto) showNotification('warning', 'Foto Profil Wajib', 'Foto profil Anda masih kosong. Silakan Edit untuk mengunggah.');
        }
      }, [activeTab, appUser]);

      useEffect(() => {
        if (activeTab === 'visit_form') {
          setLocationData({ lat: null, lng: null, address: 'Mencari lokasi...', addressObj: null });
          if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
              async (position) => {
                const lat = position.coords.latitude; const lng = position.coords.longitude;
                try {
                  const resArcgis = await fetch(`https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/reverseGeocode?f=pjson&location=${lng},${lat}`); const dataArcgis = await resArcgis.json();
                  if (dataArcgis && dataArcgis.address) {
                    const addr = dataArcgis.address; const jalan = addr.Address || addr.Neighborhood || addr.ShortLabel || ""; const kota = [addr.District, addr.City, addr.Region, addr.Postal].filter(Boolean).join(', ');
                    setLocationData({ lat, lng, address: [jalan, kota, "Indonesia"].filter(Boolean).join(', '), addressObj: addr }); return;
                  }
                } catch (e) {}
                try {
                  const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, { headers: { 'Accept-Language': 'id-ID,id' } });
                  if (res.ok) { const data = await res.json(); setLocationData({ lat, lng, address: data.display_name, addressObj: data.address }); return; }
                } catch (e) {}
                try {
                  const fallbackRes = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=id`); const fallbackData = await fallbackRes.json();
                  const parts = [fallbackData.locality, fallbackData.city, fallbackData.principalSubdivision, fallbackData.postcode, fallbackData.countryName].filter(Boolean);
                  setLocationData({ lat, lng, address: [...new Set(parts)].join(', '), addressObj: fallbackData });
                } catch (fallbackErr) { setLocationData({ lat, lng, address: 'Sinyal GPS didapat, tapi gagal memuat nama jalan (Offline)', addressObj: null }); }
              },
              (error) => { setLocationData({ lat: '-', lng: '-', address: 'Akses GPS ditolak / Gagal', addressObj: null }); }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 15000 }
            );
          } else setLocationData({ lat: '-', lng: '-', address: 'GPS tidak didukung perangkat ini', addressObj: null });
        }
      }, [activeTab]);

      useEffect(() => { 
        if (activeTab === 'dashboard') {
          fetchDashboardStats();
          handleFetchReport();
        }
        if (activeTab === 'visit') fetchVisitData(); 
      }, [activeTab, appUser]);

      if (!user || loading) return (
        <div className="h-screen flex items-center justify-center bg-slate-50 p-6 text-center font-sans">
          <div className="space-y-4"><Loader2 className="w-10 h-10 animate-spin text-blue-600 mx-auto" /><p className="text-slate-500 font-bold">Menyiapkan Aplikasi Lapangan...</p></div>
        </div>
      );

        <div className="min-h-screen bg-gradient-to-b from-blue-700 to-blue-900 flex flex-col justify-center items-center p-6 font-sans md:p-12">
          <div className="w-full max-w-sm md:max-w-md bg-white p-8 md:p-10 rounded-[2.5rem] shadow-2xl border border-white/10 space-y-6">

            <div className="text-center space-y-1">
              <h1 className="text-xl md:text-2xl font-black text-slate-800 leading-tight whitespace-nowrap tracking-tight">Cluster Loan Quality</h1>
              <p className="text-xs font-bold text-blue-600 uppercase tracking-widest">Mobile Visit App</p>
            </div>

                  <input type="text" value={loginId} onChange={(e) => setLoginId(e.target.value)} placeholder="Contoh: P001" className="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all font-bold text-slate-700" />
                </div>
              </div>
              <div>
                <label className="text-[10px] uppercase tracking-wider font-bold text-slate-400 ml-2">Password</label>
                <div className="relative mt-1">
                  <Lock className="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" />
                  <input type="password" value={loginPassword} onChange={(e) => setLoginPassword(e.target.value)} placeholder="Masukkan Password" className="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition-all font-bold text-slate-700" />
                </div>

                 <div className="bg-red-50 border border-red-100 p-3 rounded-xl flex items-start gap-2"><AlertCircle className="w-4 h-4 text-red-500 shrink-0 mt-0.5" /><p className="text-xs text-red-700 font-medium leading-relaxed">{loginError}</p></div>

            <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center gap-1 transition-all hover:scale-110 cursor-pointer ${activeTab === 'dashboard' ? 'text-blue-600 scale-110 drop-shadow-sm font-bold' : 'text-slate-400 font-medium'}`}><LayoutDashboard className="w-5 h-5" /><span className="text-[10px] uppercase tracking-tighter">Beranda</span></button>
            <button onClick={() => setActiveTab('visit')} className={`flex flex-col items-center gap-1 transition-all hover:scale-110 cursor-pointer ${(activeTab === 'visit' || activeTab === 'visit_form') ? 'text-blue-600 scale-110 drop-shadow-sm font-bold' : 'text-slate-400 font-medium'}`}><MapPin className="w-5 h-5" /><span className="text-[10px] uppercase tracking-tighter">Visit</span></button>
            <button onClick={() => setActiveTab('users')} className={`flex flex-col items-center gap-1 transition-all hover:scale-110 cursor-pointer ${activeTab === 'users' ? 'text-blue-600 scale-110 drop-shadow-sm font-bold' : 'text-slate-400 font-medium'}`}><UserCircle className="w-5 h-5" /><span className="text-[10px] uppercase tracking-tighter">Profil</span></button>
          </nav>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<MobileApp />);
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js")
          .then(reg => console.log("Fitur PWA Berhasil Diaktifkan!", reg))
          .catch(err => console.log("Gagal memuat Service Worker PWA", err));
      });
    }
  </script>
